# accelerate examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in the
# engine. See docs/examples-guard-engine.md for the design.

name: accelerate-examples

concurrency:
  # Three groups: schedule runs serialize (a run cancelled mid-way
  # loses its outcome writeback, and the outcome drives the next
  # cycle's retry); each PR serializes per number so a new push
  # cancels the stale run instead of queueing another matrix on the
  # NPU runners; each manual run stands alone. Group names are
  # repository-wide, so the PR group carries the workflow name.
  group: ${{ github.event_name == 'schedule' && 'accelerate-examples-schedule' || (github.event_name == 'pull_request' && format('accelerate-examples-pr-{0}', github.event.pull_request.number)) || format('manual-{0}', github.run_id) }}
  # true on PR runs only: a stale push's matrix should be cancelled,
  # but a schedule run cancelled mid-way loses its outcome writeback.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Daily at 02:00 Beijing time (UTC 18:00).
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
        required: false
        default: ''
        type: string
  # PR runs need no merge: GitHub executes the workflow files from the
  # PR merge ref, so a newly added trigger and engine run on the PR
  # that adds them. `pull_request`, not `pull_request_target`: the
  # declared read permissions are all the engine needs. paths lists
  # only this project's files, so a PR that touches only the shared
  # engine, scripts or schema starts no project's matrix.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'examples-guards/accelerate/**'
      - '.github/workflows/accelerate-examples.yml'

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  accelerate-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-accelerate_*),
      # artifact names and the scheduling paths under examples-guards/accelerate.
      project: accelerate
      upstream_repo: huggingface/accelerate
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 4