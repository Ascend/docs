# colossalai quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml once per
# machine generation (A2/A3) and merges the per-machine result.json files into
# one artifact; this file only declares what varies per project: schedule,
# concurrency, runners, container images, upstream repo, monitored doc and the
# test entry command.

name: colossalai-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'colossalai-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 03:20 and 15:20
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '20 3,15 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/colossalai/**'
      - 'tests/colossalai/**'
      - '.github/workflows/colossalai-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-colossalai-a2_*),
      # artifacts (colossalai-quick-start-<run_id>-a2) and the test working
      # dir (tests/colossalai).
      project: colossalai
      machine_type: a2
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # Do not add a container bind-mount for /root/.cache: the runner
      # NFS already persists that tree. Hub weights use the default
      # Hugging Face cache under /root/.cache/huggingface/hub.
      timeout_minutes: 120
      upstream_repo: hpcaitech/ColossalAI
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/colossalai/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/colossalai/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY / MACHINE_TYPE) is
      # injected by the engine. All project env prep lives in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.colossalai.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: colossalai
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg. The doc is single-card; the test
      # pins ASCEND_RT_VISIBLE_DEVICES=0, so the 2-card A3 pool runner
      # still exposes exactly one card.
      test_runner: '["linux-aarch64-a3-800i-ascend-docs-fed-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      # The A3 pool has no persisted NFS /root/.cache, so bind the HF
      # cache the doc's Qwen2.5-0.5B download lands in; keep pip wheels
      # out of the quota-limited writable layer too.
      container_options: >-
        --volume=/data/ci-cache/hf/colossalai:/root/.cache/huggingface
        --volume=/data/ci-cache/pip:/root/.cache/pip
      timeout_minutes: 120
      upstream_repo: hpcaitech/ColossalAI
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/colossalai/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/colossalai/quick_start.md
      test_command: python -m unittest tests.colossalai.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: colossalai
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
