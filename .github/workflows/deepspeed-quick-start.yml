# Run the DeepSpeed quick start on A2 and A3 with the shared engine.
# Each machine has its own monitor cache and result artifact.
name: deepspeed-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'deepspeed-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 00:00 and 12:00
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/deepspeed/**'
      - 'tests/deepspeed/**'
      - '.github/workflows/deepspeed-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: deepspeed
      machine_type: a2
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 180
      upstream_repo: deepspeedai/DeepSpeed
      doc_url: https://api.github.com/repos/${{ github.repository }}/contents/sources/deepspeed/quick_start.md?ref=${{ github.sha }}
      doc_path: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/sources/deepspeed/quick_start.md
      test_command: python -m unittest tests.deepspeed.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: deepspeed
      machine_type: a3
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 180
      upstream_repo: deepspeedai/DeepSpeed
      doc_url: https://api.github.com/repos/${{ github.repository }}/contents/sources/deepspeed/quick_start.md?ref=${{ github.sha }}
      doc_path: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/sources/deepspeed/quick_start.md
      test_command: python -m unittest tests.deepspeed.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: deepspeed
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
