# diffusers quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine.
#
# Device mounts: a2-2 runner exposes both davinci devices (check-torch
# expects `count: 2`); the doc examples themselves are single-card and
# always address device `npu:0`.
#
# Modelscope cache: the doc's slowest block downloads SD 3.5 Large
# Turbo (~28 GB net), so unlike run-scoped container-local caches,
# this project persists downloads across runs. The bind-mount is
# project-isolated (/data/ci-cache/modelscope/diffusers - per-project
# subdir under the shared modelscope cache root, NOT the shared root
# itself) so this project's downloads never collide with other
# projects' cache entries. Stale/corrupt leftovers are handled by the
# test's prepare_environment (doc_test.model_cache.
# purge_modelscope_corrupt: safetensors header validation per shard,
# model dir wiped on failure), so a dirty cache self-heals instead of
# failing the run.

name: diffusers-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'diffusers-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 3 hours at minute 20 (00:20, 03:20, ..., 21:20) -
    # offset from axolotl/tgi/whisper_cpp's :15, peft's :30 and
    # accelerate/llama_cpp's :45 so the guards don't contend for NPU
    # runners.
    - cron: '20 */3 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/Diffusers/**'
      - 'tests/diffusers/**'

permissions:
  contents: read

jobs:
  diffusers-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (monitor-state-diffusers-*), artifacts
      # (diffusers-quick-start-<run_id>) and the test working dir
      # (workflows/tests/diffusers).
      project: diffusers
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      # 4h: the test's per-command timeout is 2h (first cold-cache run
      # downloads ~28 GB at ~3.4 MB/s cluster egress ≈ 2.3h worst case);
      # the job budget must exceed the single slowest command plus the
      # rest of the doc's blocks.
      timeout_minutes: 240
      upstream_repo: huggingface/diffusers
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/Diffusers/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/Diffusers/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.diffusers.test_quick_start_ascend -v 2>&1
