# fastchat quick start guard - thin trigger over quick-start-template.yml; the engine owns the monitor loop, cache I/O and result publishing.
name: fastchat-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'fastchat-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 11:45 and 23:45
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '45 11,23 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/fastchat/**'
      - 'tests/fastchat/**'

permissions:
  contents: read

jobs:
  fastchat-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: fastchat
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/fastchat:/root/.cache/modelscope
      timeout_minutes: 120
      upstream_repo: lm-sys/FastChat
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/fastchat/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/fastchat/quick_start.md
      test_command: python -m unittest tests.fastchat.test_quick_start_ascend -v 2>&1
