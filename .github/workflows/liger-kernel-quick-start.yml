name: liger-kernel-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'liger-kernel-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/liger-kernel/**'
      - 'tests/liger_kernel/**'
      - '.github/workflows/liger-kernel-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: liger-kernel
      machine_type: a2
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/liger-kernel:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: linkedin/Liger-Kernel
      doc_url: https://api.github.com/repos/${{ github.repository }}/contents/sources/liger-kernel/quick_start.md?ref=${{ github.sha }}
      doc_path: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/sources/liger-kernel/quick_start.md
      test_command: python -m unittest tests.liger_kernel.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: liger-kernel
      machine_type: a3
      test_runner: '["linux-aarch64-a3-800i-ascend-docs-fed-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/liger-kernel:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: linkedin/Liger-Kernel
      doc_url: https://api.github.com/repos/${{ github.repository }}/contents/sources/liger-kernel/quick_start.md?ref=${{ github.sha }}
      doc_path: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/sources/liger-kernel/quick_start.md
      test_command: python -m unittest tests.liger_kernel.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: liger-kernel
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
