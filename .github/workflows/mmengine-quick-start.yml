# mmengine quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine.
#
# Cache keys (quick-start-monitor-state-mmengine_*) and artifact names
# are derived from project=mmengine, not from the workflow name.
#
# Upstream: github.com/open-mmlab/mmengine. The doc installs mmengine
# twice: once from source (``git clone`` at the latest release tag +
# ``uv pip install -e . --build-constraints`` pinning setuptools<81,
# because mmengine 0.10.x's setup.py still imports pkg_resources) and
# once from PyPI (the plain wheel), then runs 17 NPU smokes over a
# self-contained toy project (synthetic Gaussian dataset + tiny MLP,
# no model downloads). open-mmlab/mmengine publishes GitHub Releases,
# so the engine's default release_source=releases works.
#
# No device mounts and no bind mounts: MMEngine is a pure framework, so
# there is no model hub cache to persist (the doc's toy model / dataset
# are generated locally, deterministic, and cost nothing to rebuild).
# The self-hosted NPU runner (`linux-aarch64-a2-1`, 1-card) auto-passes
# `/dev/davinci*` into the container via the cluster device-plugin, so
# container_options stays empty for device binds.

name: mmengine-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'mmengine-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 10:40 and 22:40
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '40 10,22 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids
  # burning the self-hosted NPU runner on unrelated PRs. `pull_request`
  # (not `pull_request_target`): contents: read is enough, no
  # write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/mmengine/**'
      - 'tests/mmengine/**'
      - '.github/workflows/mmengine-quick-start.yml'

permissions:
  contents: read

jobs:
  mmengine-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-mmengine_*),
      # artifacts (mmengine-quick-start-<run_id>) and the test working
      # dir (tests/mmengine in the repo root; the engine sets cwd to
      # the repo root).
      project: mmengine
      # Single-card NPU runner: the doc's smoke path runs everything on
      # npu:0 and asserts `torch.npu.device_count() == 1`. The engine
      # pins the cache I/O jobs (restore-cache / publish-and-persist)
      # to GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      # CANN 9.1.0 + Python 3.12 base image, matching the
      # torch 2.9.0 / torch_npu 2.9.0.post2 stack the doc pins.
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # Empty: no model-hub cache to persist and no device bind mounts
      # needed (see the header comment).
      container_options: ''
      # 60 min ceiling: the run clones mmengine at the latest release
      # tag, installs it editable + from PyPI, fixes up the opencv
      # runtime libraries, then runs 17 NPU smokes (two of them full
      # Runner trainings). No model downloads, so the whole thing is
      # dominated by dependency resolution.
      timeout_minutes: 60
      upstream_repo: open-mmlab/mmengine
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/mmengine/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/mmengine/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep (CANN source, CUDA exclusion list,
      # uv install, torch stack probe) lives in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.mmengine.test_quick_start_ascend -v 2>&1
