# ray examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in the
# engine. Upstream tests (python/ray/tests/...) and project-owned NPU
# conformance cases (examples-guards/ray/example/...) share the single
# manifest under examples-guards/ray/examples_manifest.yaml.

name: ray-examples

concurrency:
  # schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'ray-examples-schedule' || format('manual-{0}', github.run_id) }}
  # false: a run cancelled mid-way loses its outcome writeback, and the
  # outcome is what drives the next cycle's retry.
  cancel-in-progress: false

on:
  # Enable after the expanded matrix is green on the NPU runners.
  # schedule:
  #   - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to master on API failure)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  ray-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-ray_*),
      # artifact names and the scheduling paths under examples-guards/ray.
      project: ray
      upstream_repo: ray-project/ray
      # Ray's default branch is master, not main.
      default_branch: master
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 2
