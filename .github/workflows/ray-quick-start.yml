# Ray Ascend NPU Quick Start guard. Ray examples remain in the workflows repo.
name: ray-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'ray-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 02:45 and 14:45
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '45 2,14 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/Ray/**'
      - 'tests/ray/**'
      - '.github/workflows/ray-quick-start.yml'

permissions:
  contents: read

jobs:
  ray-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: ray
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 120
      upstream_repo: ray-project/ray
      doc_url: 'https://api.github.com/repos/Ascend/docs/contents/sources/Ray/quick_start.md?ref={0}'
      doc_path: https://github.com/Ascend/docs/blob/${{ github.sha }}/sources/Ray/quick_start.md
      test_command: python -m unittest tests.ray.test_quick_start_ascend -v 2>&1
