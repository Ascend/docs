# roll examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in the
# engine. See .github/workflows/examples-template.yml for the engine contract.

name: roll-examples

concurrency:
  # Serialize schedule runs; cancel stale runs only within the same project PR.
  # Each manual run gets its own group.
  group: ${{ github.event_name == 'schedule' && 'roll-examples-schedule' || (github.event_name == 'pull_request' && format('roll-examples-pr-{0}', github.event.pull_request.number)) || format('manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Release-only guarding: monitor the latest upstream release and rerun
  # only when the release tag moves or the previous scheduled run failed.
  # Daily at 02:00 Beijing time (UTC 18:00).
  schedule:
    - cron: '0 18 * * *'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'examples-guards/roll/**'
      - '.github/workflows/roll-examples.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called workflows
# run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  roll-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces monitor-state cache keys, artifact names, and the
      # scheduling paths under examples-guards/roll.
      project: roll
      upstream_repo: alibaba/ROLL
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 4
