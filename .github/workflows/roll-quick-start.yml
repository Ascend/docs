# Run the eight-NPU ROLL quick start on A2 and A3 with the shared template.
name: roll-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'roll-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 04:35 and 16:35
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '35 4,16 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/roll/**'
      - 'tests/roll/**'
      - '.github/workflows/roll-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: roll
      machine_type: a2
      test_runner: '["linux-aarch64-a2-8"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.11
      container_options: >-
        --shm-size=32g
        --volume=/data/ci-cache/modelscope/roll:/root/.cache/modelscope
      timeout_minutes: 240
      upstream_repo: alibaba/ROLL
      doc_url: https://api.github.com/repos/${{ github.repository }}/contents/sources/roll/quick_start.md?ref=${{ github.sha }}
      doc_path: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/sources/roll/quick_start.md
      test_command: python -m unittest tests.roll.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: roll
      machine_type: a3
      test_runner: '["linux-aarch64-a3-800i-ascend-docs-fed-8"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.11
      container_options: >-
        --shm-size=32g
        --volume=/data/ci-cache/modelscope/roll:/root/.cache/modelscope
      timeout_minutes: 240
      upstream_repo: alibaba/ROLL
      doc_url: https://api.github.com/repos/${{ github.repository }}/contents/sources/roll/quick_start.md?ref=${{ github.sha }}
      doc_path: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/sources/roll/quick_start.md
      test_command: python -m unittest tests.roll.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: roll
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}

