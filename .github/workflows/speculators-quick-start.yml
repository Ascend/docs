# speculators quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml once per
# machine generation (A2/A3) and merges the per-machine result.json files into
# one artifact; this file only declares what varies per project: schedule,
# concurrency, runners, container images + options, upstream repo, monitored
# doc and the test entry command.
#
# Two machine legs run the same doc and test:
#   qs-a2  Atlas 900 A2 (Ascend 910B) - single-card runner
#   qs-a3  Atlas 900 A3 (Ascend 910C) - 2-card pool, the test pins device 0
# Both run the vllm-ascend 0.23.0 image build for their machine generation, so
# the doc's "镜像预装" version probes hold unchanged on either leg.
#
# No device mounts: the self-hosted NPU runners (`linux-aarch64-a2-1` /
# `linux-aarch64-a3-800i-ascend-docs-fed-2`) auto-pass `/dev/davinci*` into
# the container via the cluster device-plugin, so container_options only
# carries the cache mounts.
#
# A2: no modelscope cache bind-mount (same finding as diffusers): the runner's
# `/root/.cache/modelscope` is already NFS-backed and persists across runs, and
# container `--volume` isolation was verified NOT to work on this runner pool.
# Cross-run safety comes from doc_test.model_cache.purge_modelscope_corrupt
# (never touches modelscope's ._____temp in-flight area) in the test's
# prepare_environment.
#
# A3: the A3 pool has no persisted NFS `/root/.cache`, so bind the ModelScope
# cache directory the doc's snapshot_download reads and writes (cold pull
# ~17 GB: DFlash ~1 GB + Qwen3-8B ~16.4 GB).

name: speculators-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'speculators-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 00:25 and 12:25
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '25 0,12 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/speculators/**'
      - 'tests/speculators/**'
      - '.github/workflows/speculators-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-speculators-a2_*),
      # artifacts (speculators-quick-start-<run_id>-a2) and the test working
      # dir (tests/speculators in the repo root; engine sets cwd to repo root).
      project: speculators
      machine_type: a2
      # Self-hosted single-card NPU runner for the test job only; the
      # engine pins the cache I/O jobs (restore-cache /
      # publish-and-persist) to GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      # Pre-built vllm-ascend v0.23.0 image (Huaweicloud mirror of the
      # upstream ``quay.io/ascend/vllm-ascend:v0.23.0`` image). Ships
      # vllm==0.23.0 + vllm-ascend==0.23.0 + triton-ascend==3.2.2 +
      # triton 3.5.0 + torch 2.10.0+cpu + torch_npu 2.10.0.post4 + CANN
      # 9.1.0 pre-installed, so the doc's ``## 前置安装`` section only
      # verifies versions + installs modelscope — no source build, no
      # pip install of the vllm / vllm-ascend / triton-ascend wheels.
      # Huaweicloud mirror chosen for cluster egress (cluster can't
      # reach quay.io directly). New convention for projects whose test
      # body uses vllm-ascend (same as specforge's SGLang image); bare
      # CANN remains for projects that don't (peft / diffusers / etc.).
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
      container_options: ''
      # 4-step pipeline budget (convert → extract_hidden_states →
      # torchrun train → vllm-ascend serve + curl smoke):
      #   Step 2 vllm.LLM() offline: 5-7 min (Qwen3-8B weight load + 10 prompts)
      #   Step 3 torchrun 1 epoch × 10 samples: 8-12 min (single-card A2)
      #   Step 4 vllm-ascend serve + curl: 3-4 min cold + 30s smoke
      # Plus the cold-cache ModelScope first-pull: DFlash draft ~1 GB
      # (~84 s at ~12 MB/s) + Qwen3-8B verifier ~16.4 GB (~90 min at
      # ~3.1 MB/s per shard) — one-time, the runner's NFS-backed
      # modelscope cache serves hot runs. DEFAULT_COMMAND_TIMEOUT=7200
      # (2h) covers the verifier download as a single #test-setup block.
      # 240 min covers worst-case cold download + pipeline + slack.
      timeout_minutes: 240
      upstream_repo: vllm-project/speculators
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/speculators/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/speculators/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY / MACHINE_TYPE) is
      # injected by the engine. All project env prep and installs live in
      # the test subclass's prepare_environment hook.
      test_command: python -m unittest tests.speculators.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: speculators
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg. The doc asserts
      # `torch.npu.device_count() == 1`; the test pins
      # ASCEND_RT_VISIBLE_DEVICES=0, so the 2-card A3 pool runner still
      # exposes exactly one card.
      test_runner: '["linux-aarch64-a3-800i-ascend-docs-fed-2"]'
      # Same vllm-ascend 0.23.0 release, A3 (SOC ascend910_9391) build of the
      # upstream image. It ships the identical vllm / vllm-ascend /
      # triton-ascend / torch / torch_npu stack on CANN 9.1.0, so the doc's
      # preinstalled-version probes pass unchanged. The bare :v0.23.0 tag is
      # the A2 build (SOC ascend910b1).
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0-a3
      # A3 pool has no persisted NFS /root/.cache: bind the ModelScope cache
      # the doc's snapshot_download reads and writes.
      container_options: >-
        --volume=/data/ci-cache/modelscope/speculators:/root/.cache/modelscope
      # Same 240 min budget as A2: cold verifier download (up to ~90 min) is
      # the long pole, and the A3 bind-mount starts empty on a fresh host.
      timeout_minutes: 240
      upstream_repo: vllm-project/speculators
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/speculators/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/speculators/quick_start.md
      test_command: python -m unittest tests.speculators.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: speculators
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
