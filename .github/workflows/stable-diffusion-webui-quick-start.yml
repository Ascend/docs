# stable-diffusion-webui quick start guard - thin trigger over quick-start-template.yml.
name: stable-diffusion-webui-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'stable-diffusion-webui-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 08:20 and 20:20
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '20 8,20 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/sd_webui/**'
      - 'tests/sd_webui/**'
      - '.github/workflows/stable-diffusion-webui-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: stable-diffusion-webui
      machine_type: a2
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
      container_options: >-
        --volume=/data/ci-cache/modelscope/stable-diffusion-webui:/root/.cache/modelscope
        --volume=/data/ci-cache/pip:/root/.cache/pip
      timeout_minutes: 180
      upstream_repo: AUTOMATIC1111/stable-diffusion-webui
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/sd_webui/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/sd_webui/quick_start.md
      test_command: python -m unittest tests.sd_webui.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: stable-diffusion-webui
      machine_type: a3
      test_runner: '["linux-aarch64-a3-800i-ascend-docs-fed-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.10
      container_options: >-
        --volume=/data/ci-cache/modelscope/stable-diffusion-webui:/root/.cache/modelscope
        --volume=/data/ci-cache/pip:/root/.cache/pip
      timeout_minutes: 180
      upstream_repo: AUTOMATIC1111/stable-diffusion-webui
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/sd_webui/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/sd_webui/quick_start.md
      test_command: python -m unittest tests.sd_webui.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: stable-diffusion-webui
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
