# tensordict quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine.
#
# No device mounts: the self-hosted NPU runner (`linux-aarch64-a2-1`)
# auto-passes `/dev/davinci*` into the container via the cluster
# device-plugin, so container_options stays empty. Same convention as
# torchtune / xtuner / speculators.
#
# No modelscope cache bind-mount: tensordict is a pure data-structure
# library and the doc exercises install + import + 13 core-feature smoke
# commands only — no model / checkpoint downloads, so the host cache is
# not touched.

name: tensordict-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'tensordict-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 6 hours at minute 5 (00:05, 06:05, 12:05, 18:05) -
    # offset from the other every-6h guards (timm :00, torchtune :10,
    # diffusers :20, specforge :40, lm-eval/xtuner :15) and the
    # every-3h guards (axolotl/tgi/whisper_cpp :15, diffusers :20,
    # peft :30, accelerate/llama_cpp :45, speculators :25, mooncake/llm_compressor :50)
    # so the guards don't contend for NPU runners. Cadence is loose enough
    # for an upstream that releases a few times a year (tensordict
    # current latest is v0.14.0), but tight enough that doc fixes
    # propagate within a day.
    - cron: '5 */6 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/tensordict/**'
      - 'tests/tensordict/**'

permissions:
  contents: read

jobs:
  tensordict-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (monitor-state-tensordict-*), artifacts
      # (tensordict-quick-start-<run_id>) and the test working dir
      # (tests/tensordict in the repo root; engine sets cwd to repo root).
      project: tensordict
      # Self-hosted single-card NPU runner for the test job only; the
      # engine pins the cache I/O jobs (restore-cache /
      # publish-and-persist) to GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      # CANN 9.1.0 + Python 3.12 base image; the doc's
      # `## 前置安装` section only verifies versions + installs uv +
      # cmake, then `## 安装 tensordict` installs tensordict itself from
      # source (the source install path builds `_C.so` via pybind11 +
      # CMake, so cmake must be available; the test's
      # prepare_environment installs it defensively). No model downloads.
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      # 90 min covers git clone + `uv pip install -e .` (builds `_C.so`
      # from pybind11 + CMake, ~5-10 min) + the 13 ~1s smoke commands.
      timeout_minutes: 90
      upstream_repo: pytorch/tensordict
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/tensordict/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/tensordict/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.tensordict.test_quick_start_ascend -v 2>&1