# tgi quick start guard - project thin trigger.
#
# TGI (Text Generation Inference) is Hugging Face's production
# text-generation serving stack: a Rust router/scheduler plus a Python
# model-serving layer. Ascend NPU support lives in the
# cosdt/text-generation-inference fork, whose releases this guard
# follows.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# The doc under guard builds TGI from source (cargo release-opt of
# launcher + router on aarch64) before serving real /generate requests
# (single-card baseline + dual-card HCCL tensor parallelism), so the
# test job budget is larger than pure-Python projects.

name: tgi-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'tgi-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 3 hours at minute 15 (00:15, 03:15, ..., 21:15) - offset
    # from peft's :30 and accelerate's :45 so the guards don't contend
    # for NPU runners.
    - cron: '15 */3 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/tgi/**'
      - 'tests/tgi/**'

permissions:
  contents: read

jobs:
  tgi-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-tgi_*), artifacts
      # (tgi-quick-start-<run_id>) and the test working dir
      # (tests/tgi in the repo root; engine sets cwd to repo root).
      project: tgi
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest. 2-card label: the doc verifies
      # both single-card baseline and dual-card HCCL tensor parallelism
      # (--num-shard 2) on the same machine.
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # 3 h budget: cargo release-opt build of launcher + router dominates
      # the wall clock, followed by two real NPU serving runs (single-card
      # baseline + dual-card TP with readiness polling).
      timeout_minutes: 180
      # NPU support lives in the cosdt fork (official releases have no NPU
      # support): the engine follows the fork's releases, so cut a new
      # release on the fork after each validated sync of upstream changes.
      upstream_repo: cosdt/text-generation-inference
      # Doc URL points at the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch — accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/tgi/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/tgi/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.tgi.test_quick_start_ascend -v 2>&1
