# timm quick start guard - thin trigger over quick-start-template.yml; the engine owns the monitor loop, cache I/O and result publishing.
name: timm-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'timm-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/timm/**'
      - 'tests/timm/**'

permissions:
  contents: read

jobs:
  timm-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: timm
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 120
      upstream_repo: huggingface/pytorch-image-models
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/timm/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/timm/quick_start.md
      test_command: python -m unittest tests.timm.test_quick_start_ascend -v 2>&1

