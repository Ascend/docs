# torchtitan quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml once per
# machine generation and merges the two result.json files into one artifact.
# This file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine.
#
# Cache keys (quick-start-monitor-state-torchtitan-*) and artifact
# names are derived from project=torchtitan, not from the workflow
# name.
#
# Upstream: github.com/pytorch/torchtitan. The doc installs torchtitan
# twice: once from PyPI (pure-python wheel, proves the binary route)
# and once from source (`git clone` at the latest release tag +
# `uv pip install -e .`) — the training commands need the upstream
# tree for the recipe-style config API (`--module X --config Y`) and the
# `--override` mechanism. pytorch/torchtitan publishes GitHub
# Releases, so the engine's default release_source=releases works — no
# special source=tags override needed.
#
# torch 2.15.0 + torch_npu 2.15.0.dev20261116 (Ascend's nightly channel):
# torchtitan v0.4.0 is developed against torch 2.15 (its own CI pins
# torch==2.15.0) and uses torch-2.15-only APIs — the two
# torch.distributed.pipelining symbols the optional Dist-MoE package
# imports eagerly, and FSDP2's MixedPrecisionPolicy(param_dtype_override_fn=).
# The newest *released* torch_npu is 2.14.0, which pins torch==2.14.0.*,
# so the nightly build is the only one that matches torch 2.15.
# torch_npu 2.14.0 requires CANN 9.2.0 (an older CANN 9.1.0 image fails
# with a missing libhccl.so / missing aclnn symbols), so the image below
# is the 9.2.0 one. triton-ascend comes from Ascend's nightly channel
# (its `/test` sub-path is gone) and is installed with --no-deps so the
# CUDA-only community `triton` wheel never lands in the environment.

name: torchtitan-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'torchtitan-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Twice a day, 12 h apart: UTC 11:35 and 23:35
    # (Beijing +8). All quick-start guards share this cadence; the
    # (hour, minute) slot is staggered across the guards so the NPU
    # runners do not all fire at the same time.
    - cron: '35 11,23 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/torchtitan/**'
      - 'tests/torchtitan/**'
      - '.github/workflows/torchtitan-quick-start.yml'

permissions:
  contents: read

jobs:
  # Job ID rules: alphanumeric + '-' + '_' only, no dots.
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-torchtitan-a2_*),
      # artifacts (torchtitan-quick-start-<run_id>-a2) and the test
      # working dir (tests/torchtitan in the repo root; the engine
      # sets cwd to the repo root).
      project: torchtitan
      machine_type: a2
      # Dual-card NPU runner: the doc's multi-card section really runs
      # `torchrun --nproc_per_node=2` (FSDP shard=2 + HCCL), and the
      # single-card section asserts `torch.npu.device_count() == 2`.
      test_runner: '["linux-aarch64-a2-2"]'
      # CANN 9.2.0 + Python 3.12 base image — torch_npu needs CANN 9.2.0
      # (the 9.1.0 image fails with a missing libhccl.so).
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
      # 180 min budget. The doc installs torch / torch_npu / triton-ascend /
      # torchtitan, clones the upstream tree, writes the NPU override module
      # + recipe, then runs a 2-step single-card training and a 2-step
      # dual-card FSDP training. The first cold-cache run also compiles the
      # model's compiled regions and a handful of dataloader Triton kernels
      # through the bisheng compiler (serial,
      # TORCHINDUCTOR_COMPILE_THREADS=1, to stay under the runner cgroup
      # memory limit).
      timeout_minutes: 180
      upstream_repo: pytorch/torchtitan
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/torchtitan/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/torchtitan/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      # The doc test first (it installs torchtitan into the environment), then
      # the override equivalence checks -- unittest runs the named modules in
      # the given order, so the second module sees the installed torchtitan.
      test_command: python -m unittest tests.torchtitan.test_quick_start_ascend tests.torchtitan.test_npu_overrides -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: torchtitan
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg. The doc's multi-card section runs
      # `torchrun --nproc_per_node=2` (FSDP shard=2 + HCCL) and the
      # single-card section asserts `torch.npu.device_count() == 2`, so
      # the A3 pool runner must expose 2 cards as well - the test pins
      # ASCEND_RT_VISIBLE_DEVICES=0,1.
      test_runner: '["linux-aarch64-a3-800i-ascend-docs-fed-2"]'
      # CANN 9.2.0 + Python 3.12 base image, 910C flavour. torch_npu
      # needs CANN 9.2.0 either way (the 9.1.0 image fails with a
      # missing libhccl.so).
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-a3-ubuntu22.04-py3.12
      timeout_minutes: 180
      upstream_repo: pytorch/torchtitan
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/torchtitan/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/torchtitan/quick_start.md
      test_command: python -m unittest tests.torchtitan.test_quick_start_ascend tests.torchtitan.test_npu_overrides -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: torchtitan
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
