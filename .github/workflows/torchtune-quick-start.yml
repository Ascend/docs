# torchtune quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine.
#
# No device mounts: the self-hosted NPU runner (`linux-aarch64-a2-1`)
# auto-passes `/dev/davinci*` into the container via the cluster
# device-plugin, so container_options stays empty (same convention as
# accelerate / peft / timm). The doc's LoRA finetune is single-card
# and always addresses `npu:0` via ASCEND_RT_VISIBLE_DEVICES=0.
#
# No HF cache bind-mount: the test's model download runs against the
# default HF hub cache inside the container; corrupt leftovers are
# purged by the test's prepare_environment
# (doc_test.model_cache.purge_huggingface_corrupt), so a dirty cache
# self-heals instead of failing the run.

name: torchtune-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'torchtune-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 6 hours at minute 10 (00:10, 06:10, 12:10, 18:10) -
    # offset from timm's :00 and the every-3h guards (diffusers :20,
    # axolotl/tgi/whisper_cpp :15, peft :30, accelerate/llama_cpp :45)
    # so the guards don't contend for NPU runners. Cadence is loose
    # enough for an upstream that releases a few times a year
    # (torchtune), but tight enough that doc fixes propagate within a
    # day.
    - cron: '10 */6 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids burning
  # the self-hosted NPU runner on unrelated PRs. `pull_request` (not
  # `pull_request_target`): contents: read is enough, no write-token risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/torchtune/**'
      - 'tests/torchtune/**'

permissions:
  contents: read

jobs:
  torchtune-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (monitor-state-torchtune-*), artifacts
      # (torchtune-quick-start-<run_id>) and the test working dir
      # (tests/torchtune in the repo root; engine sets cwd to repo root).
      project: torchtune
      # Self-hosted single-card NPU runner for the test job only; the
      # engine pins the cache I/O jobs (restore-cache /
      # publish-and-persist) to GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      # 150 min budget. The doc body does: git clone + uv pip install
      # torchtune + a 3-step `tune run lora_finetune_single_device` over
      # Qwen2.5-0.5B (~1 GB first-time download from HuggingFace Hub) -
      # leaves room for the install chain (torchtune pulls omegaconf /
      # torchdata / tqdm) + cold-cache model download + the LoRA
      # forward/backward on NPU (first run also pays NPU compile).
      timeout_minutes: 150
      upstream_repo: meta-pytorch/torchtune
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by the
      # engine: PR head SHA on PR runs, 'main' otherwise. Same-repo PRs (head
      # SHA exists on Ascend/docs) test the PR-version of the doc; fork PRs
      # (head SHA on a fork) 404 on doc fetch - accepted, since the content
      # lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/torchtune/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/torchtune/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.torchtune.test_quick_start_ascend -v 2>&1
