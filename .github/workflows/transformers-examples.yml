# transformers examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in the
# engine. See docs/examples-guard-engine.md for the design.

name: transformers-examples

concurrency:
  # schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'transformers-examples-schedule' || format('manual-{0}', github.run_id) }}
  # false: a run cancelled mid-way loses its outcome writeback, and the
  # outcome is what drives the next cycle's retry.
  cancel-in-progress: false

on:
  # Bring-up phase: keep the schedule disabled until a few manual
  # rounds are green (same policy as accelerate-examples.yml).
  # Re-enable:
  # schedule:
  #   - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  transformers-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-transformers_*),
      # artifact names and the scheduling paths under
      # examples-guards/transformers.
      project: transformers
      upstream_repo: huggingface/transformers
      target_ref: ${{ inputs.target_ref }}
      # 27 supported entries on linux-aarch64-a2-2; 8 keeps the daily run
      # moving without stacking the whole matrix on the runner pool at
      # once (value carried over from the workflows-repo pipeline).
      max_parallel: 8
