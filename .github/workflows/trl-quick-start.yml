# trl quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: concurrency,
# runner, container image + options, upstream repo, monitored doc,
# and the test entry command. The guard loop, cache I/O, state relay
# and publishing all live in the engine.
#
# Engine-fixed behaviours this trigger relies on (declared in the
# engine, NOT here):
#   * cache key prefix: monitor-state-trl-  (from inputs.project)
#   * artifact name:    trl-quick-start-<run_id>
#   * result.json is written by the engine and validated against
#     schemas/result.schema.json before upload.
#
# schedule is enabled; workflow_dispatch stays for manual reruns.
# The engine's schedule-only steps (monitor / record-monitor-outcome /
# cache save) run on schedule triggers; dispatch forces a manual test
# without mutating monitor state.

name: trl-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'trl-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids
  # burning the self-hosted NPU runner on unrelated PRs.
  pull_request:
    branches: [main]
    paths:
      - 'sources/trl/**'
      - 'tests/trl/**'

permissions:
  contents: read

jobs:
  trl-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (monitor-state-trl-*), artifacts
      # (trl-quick-start-<run_id>) and the test working dir
      # (workflows/tests/trl).
      # result.json is uploaded by the engine's publish-and-persist job
      # (ubuntu-latest, if: always()); the NPU test job never uploads.
      project: trl
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/trl:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: huggingface/trl
      # Doc under guard: sources/trl/quick_start.md in the upstream
      # Ascend/docs repo. {0} is filled by the engine: PR head SHA on PR
      # runs, 'main' otherwise. Same-repo PRs (head SHA exists on
      # Ascend/docs) test the PR-version of the doc; fork PRs (head SHA
      # on a fork) 404 on doc fetch - accepted, since the content lands
      # on Ascend/docs post-merge.
      # Doc body does: PyPI 二进制安装 trl + SFT / DPO 双方法 LoRA smoke
      # （模型与数据集 HuggingFaceH4/ultrafeedback_binarized 均经
      # ModelScope snapshot_download 自动下载到默认缓存；
      # /root/.cache/modelscope 挂载供跨轮复用）。
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/trl/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/trl/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.trl.test_quick_start_ascend -v 2>&1
