# trl quick start guard - thin trigger over quick-start-template.yml; the engine owns the monitor loop, cache I/O and result publishing.
name: trl-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'trl-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'sources/trl/**'
      - 'tests/trl/**'

permissions:
  contents: read

jobs:
  trl-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: trl
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/trl:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: huggingface/trl
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/trl/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/trl/quick_start.md
      test_command: python -m unittest tests.trl.test_quick_start_ascend -v 2>&1
