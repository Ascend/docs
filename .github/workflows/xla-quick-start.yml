# xla quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule, concurrency,
# runner, container image + options, upstream repo, monitored doc, and
# the test entry command. The guard loop, cache I/O, state relay and
# publishing all live in the engine. See the engine's `workflow_call.inputs`
# block for the full input contract.
#
# Cache keys (monitor-state-xla_*) and artifact names
# (xla-quick-start-<run_id>) are derived from project=xla.
#
# Upstream: the canonical repo is gitcode.com/cann/xla-npu (China
# AtomGit platform, which the engine's GitHub API polling cannot reach).
# We poll hicann/xla-npu — its GitHub mirror — which publishes no releases
# and no tags, so the engine's ref fallback chain (/releases/latest ->
# /releases -> /tags -> /commits/HEAD) bottoms out at /commits/HEAD and
# anchors the mirror's default-branch HEAD sha as the change key. The doc
# clones from gitcode.com/cann/xla-npu (the canonical source, a superset
# of the mirror's history) and checks out that sha.
#
# No ModelScope / pip bind mounts: the doc does a pure source build (JDK /
# Bazel / OpenXLA downloads live inside the clone's build/ dir via
# huaweicloud mirrors) and an operator-only smoke (random tensors), no
# model weights to cache. The self-hosted NPU runner (linux-aarch64-a2-1)
# auto-passes /dev/davinci* into the container via the cluster device-plugin.

name: xla-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'xla-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Run every 6 hours: '45 */6 * * *' fires at minute 45 of every
    # 6th hour (00:45, 06:45, 12:45, 18:45). Cadence is loose enough
    # for a tagless upstream (mirror HEAD as the change key), but
    # tight enough that doc fixes propagate within a day.
    - cron: '45 */6 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids
  # burning the self-hosted NPU runner on unrelated PRs. `pull_request`
  # (not `pull_request_target`): contents: read is enough, no write-token
  # risk.
  pull_request:
    branches: [main]
    paths:
      - 'sources/xla/**'
      - 'tests/xla/**'

permissions:
  contents: read

jobs:
  xla-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (monitor-state-xla_*), artifacts
      # (xla-quick-start-<run_id>) and the test working dir
      # (workflows/tests/xla).
      project: xla
      # Self-hosted single-NPU runner for the test job only; the engine
      # pins the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest. xla-npu's ops/qwen/examples are
      # single-device inference workloads, so one card is enough.
      test_runner: '["linux-aarch64-a2-1"]'
      # xla-npu requires Python 3.11 (build.sh hard-requires >= 3.11 and
      # freezes the bazel hermetic toolchain at 3.11) and CANN >= 8.5.0.
      # CANN 9.0.0 satisfies the requirement; the py3.11 variant is the
      # same tag family flash-linear-attention pins to.
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
      # No extra bind-mounts: pure source build + operator smoke, no
      # weights and no cross-run wheel cache (build.sh downloads JDK /
      # Bazel / OpenXLA it into the clone's build/ dir each run).
      container_options: ''
      # Doc body does: git clone xla-npu (gitcode) + ./build/build.sh
      # install (JDK/Bazel download + OpenXLA checkout + bazel compile
      # of the PJRT plugin + JAX install) + JAX-NPU backend smoke +
      # examples/ops CPU-vs-NPU comparison. 240 min covers the cold
      # source build (dominant cost) + operator run.
      timeout_minutes: 240
      # GitHub mirror of gitcode.com/cann/xla-npu, polled by the engine
      # (see header note). Tagless -> ref chain bottoms out at
      # /commits/HEAD.
      upstream_repo: hicann/xla-npu
      # Doc URL points to the upstream Ascend/docs repo. {0} is filled by
      # the engine: PR head SHA on PR runs, 'main' otherwise. Same-repo
      # PRs (head SHA exists on Ascend/docs) test the PR-version of the
      # doc; fork PRs (head SHA on a fork) 404 on doc fetch - accepted,
      # since the content lands on Ascend/docs post-merge.
      doc_url: 'https://raw.githubusercontent.com/Ascend/docs/{0}/sources/xla/quick_start.md'
      doc_path: https://github.com/Ascend/docs/blob/main/sources/xla/quick_start.md
      # cwd is the repo root inside the `workflows` checkout (matches
      # engine template's `working-directory: workflows`); env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep (CANN env + build tools + working
      # dir) lives in the test subclass's prepare_environment hook; the
      # build itself is in the doc.
      test_command: python -m unittest tests.xla.test_quick_start_ascend -v 2>&1
