  # [平台] FP8：模块级 from torchao.float8 import Float8LinearConfig
  # （fsdp2_fp8.py:24）。2026-09-18 npu-4 源码+实测复核，blocker 分四层：
  #   ① torch API 契约：torchao 0.18.0 import 即死——要
  #     torch.nn.functional.ScalingType/scaled_grouped_mm（torch 2.10+ API），
  #     而栈被 torch_npu 2.9 ABI 钉在 torch 2.9；torchao==0.15.0（纯 py
  #     wheel）可 import 且 is_torchao_available()=True——依赖层可解但需钉旧版
  #   ② 真根因（实测）：fp8 dtype 在 910B4 被 torch_npu kernel 层拒绝——
  #     t.to(float8_e4m3fn) 死于 aclnnInplaceCopy err 561103；torchao 全部
  #     fp8 GEMM 走的 torch._scaled_mm 同死在这层。硬件无 FP8 单元，软件
  #     连存储都不给，任何依赖组合无解。昇腾 FP8 硬件现状：910B3/B4 均无
  #     FP8；910C（Atlas 950 / CloudMatrix 384）是唯一宣称原生 FP8
  #     （E4M3/E5M2）的昇腾卡，但当前 runner 池（a2-1/a2-2/npu-1..4）
  #     全是 910B4，没有 FP8 卡可跑
  #   ③ example 设计：默认 Hermes-8B 随机 init + cpu_ram_efficient_loading=
  #     False → nd_parallel 同款 32G cgroup OOM；TorchDynamoPlugin(
  #     backend="inductor") 无条件传入，NPU 栈无 inductor 后端（需
  #     triton-ascend）——--precision bf16 逃生门也被堵且守护不到 fp8 语义
  #   ④ TE / msamp 两后端同样 CUDA-only
  # （coder 实跑：ModuleNotFoundError rc=2 为①的前身；①②③已逐层实测钉死）
  # 转正条件 = 910C 级 FP8 硬件 + 配套 torch_npu FP8 kernel + torchao NPU
  # 后端（③的 inductor 还需 triton-ascend 就绪）
  - examples/torch_native_parallelism/fsdp2_fp8.py

  # [不可解] ND parallelism：原注"32G cgroup 撞 8B FSDP2 init、需 64G+ pod"
  # 已 2026-09-18 npu-2 a2-2 overlay 实证推翻——CLI `--model-name` 被所有历史
  # 验证忽略：默认 Hermes-3-Llama-3.1-8B（nd_parallel.py:39 MODEL_ID 硬编）才是
  # host RAM 杀手（2 rank × 16GB = 32GB）；overlay 换 SmolLM-360M（Llama
  # 架构，已 CI 种子）后 host RAM 仅 2×0.7GB，cgroup 毫无压力。
  # FSDP2 + bf16 + NPU HCCL 训练本身 rc 内正常（Step 0/2/3 loss 输出，
  # trainer 版 step 60 loss 2.16→2.10 收敛）。
  # 真正的剩余 blocker 是两个与资源无关的边角：
  #   (a) nd_parallel.py:158 末尾 `model.save_pretrained(...)`。根因不在
  #       "张量分片"而是 state_dict 的值类型变了：dp-shard-size≥2 时
  #       accelerate 用 FullyShardedDataParallelPlugin(state_dict_type=
  #       "SHARDED_STATE_DICT") 把 model wrap 成 FSDP2，`model.state_dict()`
  #       每个权重变成 DTensor（逻辑分片对象，每个 rank 只持 _local_tensor），
  #       不再是普通 Tensor。transformers save_pretrained → safetensors
  #       save_file → _find_shared_tensors（safetensors/torch.py:81）为去重
  #       对每个值调 storage_ptr(v)（torch.py:18/22）→ v.untyped_storage()
  #       .data_ptr() / v.storage().data_ptr()；DTensor.data_ptr() 返回 0、
  #       且 torch_npu 下 DTensor.storage() 不是有效 storage，直接抛
  #       RuntimeError "Attempted to access the data pointer on an invalid
  #       python storage"。属 safetensors × FSDP2(DTensor) × torch_npu 三方
  #       ABI gap：safetensors 假设 state_dict 是取得到 data_ptr 的普通
  #       tensor，DTensor 破坏了这个契约，torch_npu 比 CUDA 更"硬"（直接
  #       抛而非给占位返回）。单卡 dp-shard-size=1 不 wrap、state_dict 是
  #       普通 Tensor 故保存正常；`accelerate.save_state()`（FSDP2 官方
  #       checkpoint 路）走 gather/分片语义也正常——只有 save_pretrained
  #       撞这个 gap。修法选一（均 patch，多卡/overlay 够不到）：example 侧
  #       unwrap_model 或用 save_state；accelerate 侧 save_pretrained 先
  #       full_tensor/gather；torch_npu/safetensors 让 DTensor.storage()
  #       返回 0/_local_tensor 指针而非硬抛。
  #   (b) nd_parallel_trainer.py:51 `TrainingArguments(num_train_epochs=1,
  #       per_device_train_batch_size=1, logging_steps=5, ...)` 写死 1
  #       epoch 无 max_steps CLI 旋钮，CI smoke（默认 1-2 epoch）跑不完
  #       （SmolLM×a2-2 1 epoch ≈ 4-5h）
  # 多卡解决不了 32G cgroup——host RAM 需求随 rank 数线性增，4 rank = 64GB；
  # 上游 `cpu_ram_efficient_loading`（只 rank0 加载 + sync）example 未传且
  # 无 CLI 旋钮——此路径才是"多卡后 RAM 更省"的明证 override，但打不开。
  # 旧注另提的 log_with=["wandb"]、裸 python dist.all_reduce 无 pg 在
  # accelerate launch + WANDB_DISABLED 下都不是问题。
  # （coder 实跑：accelerate launch --num_processes 2 --mixed_precision bf16
  #   nd_parallel.py --dp-shard-size 2 --num-steps 3 --sequence-length 128
  #   --model-name HuggingFaceTB/SmolLM-360M 训练 OK；末尾 save_pretrained
  #   rc=1 @ safetensors storage.data_ptr。2026-09-20 最小复现钉死 DTensor：
  #   distribute_tensor + Shard 产出的 DTensor，dt.data_ptr()==0、
  #   dt._local_tensor.data_ptr()==真实指针、save_file({"w": dt}) 在
  #   storage_ptr(v) 抛 invalid python storage，坐实上面 DTensor 契约 gap）
  # nd_parallel_trainer.py:23 同款 Hermes-3-Llama-3.1-8B 默认，但 overlay
  # --model-name 同样可绕；跑不完是 num_train_epochs=1 无 max_steps 写死。
  - examples/torch_native_parallelism/nd_parallel.py
  - examples/torch_native_parallelism/nd_parallel_trainer.py

