  # ===== 上游源码 bug（改上游源码才能通，无 overlay 可绕）=======================
  # 以下 5 条都是上游脚本 / 引擎自身的 bug，实测必崩：
  # 1) clevr SFT：loader 读错 processor 键名——clevr_count_70k.py:110 用旧键
  #    token_type_ids 取 mm_token_type_ids（transformers 5.x 下恒 None），SFT
  #    collate 阶段 torch.tensor(None) 崩。（geometry3k_grpo 读同一错键无碍：GRPO
  #    不 collate 数据集样本。）
  # 2) hhrlhf RW：引擎在打包前就读 x["cu_seqlens"]（rw_engine.py:52→21），而 collate
  #    只产 input_ids/attention_mask（rw_trainer.py:61-73）→ KeyError。
  # 3) hhrlhf DPO：loss 聚合硬编码 fp64（functional.py:829-835），Ascend 不支持。
  # 4) virl39k GRPO：reward_fn 以函数对象传入，过 RPC 时 JSON 序列化失败（正常条目
  #    传"点路径"字符串）；同 bug 的 vlm_npu/geometry3k_grpo.py 见下方工具段。
  # 5) agent_service：入口硬编码 LocalScheduler(experiment_name=..., trial_name=...,
