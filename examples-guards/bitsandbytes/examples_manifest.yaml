version: 1
scan:
  root: examples
  include_extensions: ['.py']
  max_depth: 3
supported:
  # CPU AdamW finetune. The script keeps tensors on CPU; a green run
  # means bitsandbytes' CPU optimizer still trains, not that NPU
  # inference worked. Success is the script's own loss line.
  - path: examples/cpu/cpu_training.py
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --steps 5
      - --log_interval 1
      - --max_length 64
      - --batch_size 1
    timeout_minutes: 90
  # 8-bit gemma-2-2b-it, torch.compile, 32 new tokens. The run script
  # requires NPUCachingAllocator in the log after exit 0.
  - path: examples/compile_inference.py
    profile: npu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 120
unsupported:
  # tag 0.50.2 examples/int8_inference_huggingface.py:
  # model_name = "meta-llama/Llama-2-7b-hf"; Hub API reports gated=manual.
  # max_memory is built from torch.cuda.mem_get_info()[0], and
  # n_gpus = torch.cuda.device_count().
  # LlamaForCausalLM.from_pretrained(..., device_map="auto", load_in_8bit=True).
  - examples/int8_inference_huggingface.py
  # tag 0.50.2 examples/xpu/paged_xpu_training.py:
  # --device defaults to "xpu". main() then asserts
  # hasattr(torch, "xpu") and torch.xpu.is_available(), or
  # torch.cuda.is_available() when --device cuda. There is no npu branch.
  # from_pretrained(..., device_map=device) and the batch is .to(device).
  - examples/xpu/paged_xpu_training.py
  # tag 0.50.2 examples/xpu/benchmark_paged_memory.py:
  # --device defaults to "xpu". get_accelerator() returns torch.xpu or,
  # for any other name, torch.cuda. The model is
  # LlamaForCausalLM(config).to(dtype=dtype, device=args.device), and
  # peak memory is read from that accelerator. There is no npu branch.
  - examples/xpu/benchmark_paged_memory.py
