version: 1
# 主仓 deepspeedai/DeepSpeed 提供被测源码；example 路径相对 deepspeedai/DeepSpeedExamples。
# supported 为 NPU CI 看护入口（新增项待实跑）；unsupported 仅登记尚未接入的设备用例。
# 库、安装脚本、单元测试、数据准备及结果处理工具不作为 example 登记。
# 扫描无 exclude；同一 example 的启动包装合并到主入口。
scan:
  root: ''
  include_extensions: ['.sh', '.py']
supported:
  # RoBERTa MLM 训练；支持单卡 NPU，2 层模型/10 步验证 ZeRO-1 与 CPU offload。
  - path: training/HelloDeepSpeed/run_ds.sh
    profile: deepspeed
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--num_layers 2'
      - '--num_heads 2'
      - '--h_dim 64'
      - '--ff_dim 128'
      - '--batch_size 2'
      - '--num_iterations 10'
      - '--log_every 5'
      - '--dtype bf16'
    timeout_minutes: 60
  # SFT 训练；支持单卡 NPU，使用本地 OPT-125M 和 8 行数据。
  - path: applications/DeepSpeed-Chat/training/step1_supervised_finetuning
    exec: applications/DeepSpeed-Chat/training/step1_supervised_finetuning/main.py
    profile: ds_chat_sft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 4'
      - '--per_device_eval_batch_size 4'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--print_loss'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 120
  # 奖励模型训练；支持单卡 NPU，使用本地 OPT-125M 和小型偏好数据。
  - path: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning
    exec: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning/main.py
    profile: ds_chat_rw
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 4'
      - '--per_device_eval_batch_size 4'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 120
  # DPO 偏好训练；支持单卡 NPU，使用本地 OPT-125M 和小批量数据。
  - path: applications/DeepSpeed-Chat/training/step2_dpo_finetuning
    exec: applications/DeepSpeed-Chat/training/step2_dpo_finetuning/main.py
    profile: ds_chat_dpo
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 2'
      - '--per_device_eval_batch_size 2'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--beta 0.1'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 150
  # RLHF 训练；支持单卡 NPU，OPT-125M actor/critic 使用官方 5 步测试模式。
  - path: applications/DeepSpeed-Chat/training/step3_rlhf_finetuning
    exec: applications/DeepSpeed-Chat/training/step3_rlhf_finetuning/main.py
    profile: ds_chat_rlhf
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--actor_model_name_or_path ${OPT_125M_PATH}'
      - '--critic_model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--enable_test_mode'
      - '--test_stop_step 5'
      - '--actor_zero_stage 2'
      - '--critic_zero_stage 2'
      - '--dtype bf16'
      - '--deepspeed'
    timeout_minutes: 180
  # 文本生成；支持 NPU 上的 HF baseline，本地 OPT-125M 绕过 DS kernel 注入。
  - path: inference/huggingface/text-generation/inference-test.py
    profile: ds_infer
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model ${OPT_125M_PATH}'
      - '--hf_baseline'
      - '--dtype float32'
      - '--max_new_tokens 8'
    timeout_minutes: 60
  # CIFAR-10 分类；支持单卡 NPU，上游 launcher 配合 ModelScope 预置数据。
  - path: training/cifar
    exec: training/cifar/run_ds.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 90
  # ZeRO 状态 offload；支持单卡 NPU，使用小模型和合成数据。
  - path: training/offload_states/offload_states.py
    profile: deepspeed
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden_dim 1024'
      - '--nlayers 2'
    timeout_minutes: 60
  # CIFAR MoE 训练；支持两卡 HCCL/EP=2，局部禁用 torch.compile 避开 Triton 依赖。
  - path: training/cifar/run_ds_moe.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 120
  # AutoTP loss 等价性；支持四卡 NPU，Qwen3-0.6B 验证 TP=1/3/4 各 5 步。
  - path: training/autotp_equivalence
    exec: training/autotp_equivalence/train.py
    profile: ds_autotp_equivalence
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${QWEN3_06B_PATH}'
      - '--steps 5'
      - '--seq_len 32'
      - '--micro_batch_size 1'
      - '--log_every 1'
    timeout_minutes: 180

  # HF Trainer AutoTP；八卡 TP=8、本地模型和 fixture，3 步含 2 步预热，已通过 #28。
  - path: training/tensor_parallel/hf_integration/train.py
    profile: ds_hf_autotp
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path ${ALPACA_CI_PATH}'
      - '--output_dir ${CI_OUTPUT_DIR}/hf-autotp'
      - '--max_steps 3'
      - '--model_max_length 128'
      - '--per_device_train_batch_size 1'
      - '--gradient_accumulation_steps 1'
      - '--learning_rate 2e-5'
      - '--warmup_steps 2'
      - '--logging_steps 1'
      - '--eval_strategy no'
      - '--save_strategy no'
      - '--report_to none'
      - '--bf16 True'
      - '--tf32 False'
      - '--gradient_checkpointing False'
      - '--dataloader_pin_memory False'
      - '--dataloader_num_workers 0'
    timeout_minutes: 120
  # CIFAR PR-MoE；两卡 EP=2、残差专家 2/4，eager MoE 已通过 #27。
  - path: training/cifar/run_ds_prmoe.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 120
  # 动态 batch/LR；单卡合成序列打包及 2 epoch，已通过 #27。
  - path: training/data_efficiency/variable_batch_size_and_lr/variable_batch_size_and_lr_example.py
    profile: ds_variable_batch
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--pipeline-num-stages 0'
    timeout_minutes: 60
  # ZenFlow offload；两卡 256 维/2 层合成数据，6 次迭代已通过 #27。
  - path: training/DeepSpeed-ZenFlow/benchmark/zf_benchmark.py
    profile: ds_zenflow
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden_dim 256'
      - '--nlayers 2'
      - '--iteration 3'
      - '--dtype torch.bfloat16'
      - '--pin_memory_opts 0'
      - '--topk_ratios 0.1'
      - '--update_intervals 2'
      - '--overlap_steps 0'
    timeout_minutes: 90
  # Wanda 校准剪枝；NPU 本地 OPT-125M/JSONL，4×32 token 校准已通过 #27。
  - path: compression/reasoning_aware_compression/prune.py
    profile: ds_rac_prune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model ${OPT_125M_PATH}'
      - '--device npu'
      - '--dtype float32'
      - '--pruning-method wanda'
      - '--calibration prompt'
      - '--dataset ${RAC_CI_PATH}'
      - '--prompt-column prompt'
      - '--no-chat-template'
      - '--nsamples 4'
      - '--seqlen 32'
      - '--batch-size 1'
      - '--scope all'
      - '--layer-thirds 1'
      - '--sparsity 0.5'
      - '--output ${CI_OUTPUT_DIR}/rac-pruned'
      - '--save-report'
    timeout_minutes: 90

  # SFT 生成评测；单卡先训练小检查点，再对比基础/微调模型，8 token，待实跑。
  - path: applications/DeepSpeed-Chat/training/step1_supervised_finetuning/prompt_eval.py
    profile: ds_chat_prompt_eval
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path_baseline ${OPT_125M_PATH}'
      - '--model_name_or_path_finetune ${CI_OUTPUT_DIR}/prompt-eval-sft'
      - '--max_new_tokens 8'
      - '--language English'
    timeout_minutes: 120
  # 奖励评分 smoke；单卡本地 OPT-125M/初始化评分头，两组偏好 forward，待实跑。
  - path: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning/rw_eval.py
    profile: ds_chat_reward_eval
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--num_padding_at_beginning 1'
    timeout_minutes: 60
  # 固定长度 HF AutoTP；八卡 TP=8/序列 128/3 步，校验 padding 与 label masking，待实跑。
  - path: training/tensor_parallel/hf_integration/train_bench_length.py
    profile: ds_hf_bench_length
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path ${ALPACA_CI_PATH}'
      - '--output_dir ${CI_OUTPUT_DIR}/hf-bench-length'
      - '--max_steps 3'
      - '--model_max_length 128'
      - '--per_device_train_batch_size 1'
      - '--gradient_accumulation_steps 1'
      - '--learning_rate 2e-5'
      - '--warmup_steps 2'
      - '--logging_steps 1'
      - '--eval_strategy no'
      - '--save_strategy no'
      - '--report_to none'
      - '--bf16 True'
      - '--tf32 False'
      - '--gradient_checkpointing False'
      - '--dataloader_pin_memory False'
      - '--dataloader_num_workers 0'
    timeout_minutes: 120
  # SuperOffload 入口；两卡 ZeRO-Offload 模式/CPU 参数和优化器卸载，3 步，待实跑。
  - path: training/DeepSpeed-SuperOffload/finetune_zero3.py
    profile: ds_superoffload
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name ${OPT_125M_PATH}'
      - '--dataset_name ${ALPACA_DATASET_DIR}'
      - '--lr 0.001'
      - '--batch_size 1'
      - '--num_train_epochs 1'
      - '--max_length 128'
      - '--bench_steps 3'
      - '--warmup_steps 1'
      - '--attn_implementation eager'
      - '--output_dir ${CI_OUTPUT_DIR}/superoffload'
    timeout_minutes: 120

  # 模型张量卸载对比；单卡 ZeRO-3/native mlock，合成小模型/两臂各 3 步，待实跑.
  - path: benchmarks/pin_memory/model_tensor_offload/bench.py
    profile: ds_pin_memory
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden 4'
      - '--layers 2'
      - '--batch 1'
      - '--seq 16'
      - '--steps 3'
      - '--warmup 1'
      - '--zero-stage 3'
    timeout_minutes: 120
  # 激活卸载对比；单卡 NPU checkpoint/native pin，两臂各 3 步，待实跑。
  - path: benchmarks/pin_memory/activation_offload/bench.py
    profile: ds_pin_memory
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden 64'
      - '--layers 2'
      - '--batch 1'
      - '--seq 32'
      - '--steps 3'
      - '--warmup 1'
    timeout_minutes: 120
  # 主机/NPU 双向拷贝；三种 1MiB 缓冲区各 3 次，不冒充 CUDA host registration，待实跑。
  - path: benchmarks/pin_memory/h2d_d2h/bench.py
    profile: ds_pin_memory
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--sizes-mib 1'
      - '--warmup 1'
      - '--iters 3'
      - '--skip-native-register'
    timeout_minutes: 120
  # ZenFlow LLM 微调；OPT-125M/16 行本地 Alpaca，单卡 CPU optimizer offload 与保存，待实跑。
  - path: training/DeepSpeed-ZenFlow/finetuning/finetune_llama.py
    profile: ds_zenflow_finetune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name "${OPT_125M_PATH}"'
      - '--lr 0.00002'
      - '--batch_size 1'
      - '--num_train_epochs 1'
      - '--output_dir "${CI_OUTPUT_DIR}/zenflow-finetune-checkpoint"'
    timeout_minutes: 120
  # OPSD 在线蒸馏；小模型/3 步 rollout、教师 CPU 缓存与 streamed KL，待实跑。
  - path: training/opsd/main.py
    profile: ds_opsd
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # Student TP/ZeRO-3 smoke；两卡小模型 forward/backward/step，关闭可选 CPU optimizer offload，待实跑。
  - path: training/opsd/test_student_autotp_zero3.py
    profile: ds_opsd
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # Teacher TP/ZeRO-3 smoke；两卡小模型参数 CPU offload 与 logit cache，待实跑。
  - path: training/opsd/test_teacher_autotp_zero3.py
    profile: ds_opsd
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # BERT 推理计时；本地模型/4 次 DS engine forward 与 NPU 同步，待实跑。
  - path: benchmarks/inference/bert-bench.py
    profile: ds_legacy_inference_bench
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model "${BERT_BASE_CASED_PATH}"'
      - '--deepspeed'
      - '--dtype fp32'
      - '--trials 4'
    timeout_minutes: 120
  # GPT 推理计时；OPT-125M/4 次×8 token，DS engine 与 NPU 同步，待实跑。
  - path: benchmarks/inference/gpt-bench.py
    profile: ds_legacy_inference_bench
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model "${OPT_125M_PATH}"'
      - '--deepspeed'
      - '--dtype fp32'
      - '--max-tokens 8'
      - '--trials 4'
    timeout_minutes: 120
  # HF/DS 生成一致性；OPT-125M/2 个 prompt，强制断言零 mismatch，待实跑。
  - path: inference/huggingface/text-generation/ds-hf-compare.py
    profile: ds_hf_ds_compare
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model "${OPT_125M_PATH}"'
      - '--dtype float32'
      - '--num_inputs 2'
      - '--min_length 12'
      - '--max_length 16'
      - '--print_outputs'
    timeout_minutes: 120
  # BERT-large 填词；本地同名 ModelScope 权重，单卡短序列 DS 推理，待实跑。
  - path: inference/huggingface/fill-mask/test-bert.py
    profile: ds_fill_mask_bert
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # ELECTRA 填词；本地 generator 权重，两卡 TP=2 的显式切分策略，待实跑。
  - path: inference/huggingface/fill-mask/test-electra.py
    profile: ds_fill_mask_electra
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # RoBERTa-large 填词；本地权重与两卡 TP=2，验证 NPU 结果，待实跑。
  - path: inference/huggingface/fill-mask/test-roberta.py
    profile: ds_fill_mask_roberta
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # T5 翻译；本地权重与两卡 TP=2，模型生成配置限制 8 token，待实跑。
  - path: inference/huggingface/translation/test-t5-base.py
    profile: ds_t5_translation
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120
  # Wav2Vec2 CTC 推理；两条合成音频/本地同名模型，验证 NPU logits 而非识别准确率，待实跑。
  - path: inference/huggingface/automatic-speech-recognition/test-wav2vec2.py
    profile: ds_asr_ctc
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: []
    timeout_minutes: 120

  # LLM 微调；SmolLM2-135M/匹配 rotary 的依赖，两卡 ZeRO-2/3 步，待实跑。
  - path: training/deepspeed_finetune_demo/finetune_llama.py
