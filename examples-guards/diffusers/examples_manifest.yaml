version: 1
scan:
  root: examples
  # .yaml is not scanned: the files under examples/ are deepspeed/accelerate
  # run configs, not launchable examples. .md/.txt/.json are non-examples.
  include_extensions: ['.py', '.sh']
  # files-only 模型（examples-guards/README.md）。2026-10-08 起
  # 对齐收口：原 scan.exclude 的 33 条规则全部迁入
  # unsupported 段（上游自测 / helper / pipeline 模块 / community 整目录等，
  # 带分组注释与理由），scan 只保留 root + include_extensions 两个键。
  # unsupported 覆盖全部 308 个扫描文件：supported(52) + unsupported(256)。

# 新版 diffusers 需求 huggingface-hub>=1.23，huggingface-hub>=1.23 需求
# transformers>=5.x，任何 transformers<5.x 的用例都无法跑通

supported:
  # ${...} 由 setup_example.sh 预下后写入 GITHUB_ENV：
  #   ${SDXL_BASE_PATH} / ${THREE_D_ICON_PATH}  <- profile diffusers-sdxl
  #   ${SD15_MODEL_PATH} / ${THREE_D_ICON_PATH} <- profile diffusers-sd15


  # FLUX.2 Klein 4B LoRA（t2i）。NPU fork（自带 torch_npu 适配 +
  # set_attention_backend("_native_npu")）；模型非 gated，setup 预下 ~15GB。
  # 冻结 transformer ~7.2GB，LoRA + bf16 单卡放得下。
  - path: examples/dreambooth/train_dreambooth_lora_flux2_klein.py
    profile: diffusers-flux2-klein
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${FLUX2_KLEIN_MODEL_PATH}
      - --instance_data_dir ${FIXTURE_DIR}/images
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --train_batch_size 1
      - --gradient_checkpointing
      - --mixed_precision bf16
      - --max_train_steps 1
    timeout_minutes: 600

  # CogVideoX-5b-I2V LoRA。必须用 5b-I2V（不是 1.5，脚本不处理 1.5 的 ofs 输入）。
  - path: examples/cogvideo/train_cogvideox_image_to_video_lora.py
    profile: diffusers-cogvideo-i2v
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path THUDM/CogVideoX-5b-I2V
      - --instance_data_root ${COGVIDEOX_DATASET_DIR}
      - --caption_column prompt.txt
      - --video_column videos.txt
      - --max_num_frames 9
      - --gradient_checkpointing
      - --enable_slicing --enable_tiling
      - --train_batch_size 1
      - --max_train_steps 1
      - --mixed_precision fp16
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 360
  # Kandinsky prior 全量（naruto）。bf16 + ZeRO-2，静态 ~8GB/卡。收尾会在 CPU
  # 组装完整 pipeline 再拉 decoder 仓 9.8GB → 长 timeout。
  - path: examples/kandinsky2_2/text_to_image/train_text_to_image_prior.py
    profile: diffusers-kandinsky-prior
    launcher: accelerate-deepspeed
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 512
      - --train_batch_size 1
      - --mixed_precision bf16
      - --max_train_steps 1
    timeout_minutes: 360
  # ControlNet webdataset（SDXL）。webdataset 钉 0.2.86（vendored 旧 tar 迭代器
  # 在新版 KeyError）；shard 由 setup 合成 1024 样本（shuffle 缓冲写死 1000，
  # 样本不足第一个 batch 永远不来）。单卡 fp16 在 optimizer.step 常驻 ~26.6GB
  # 必炸（与分辨率无关），改双卡 ZeRO-2 + bf16（fp16 在 DS 反向有 aclnn 前科）。
  # 训练管线用 ResampledShards（不按 rank 切分），单 shard 双卡各自可读。
  - path: examples/research_projects/controlnet/train_controlnet_webdataset.py
    profile: diffusers-controlnet-wds
    launcher: accelerate-deepspeed
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --output_dir ${CI_OUTPUT_DIR}
      - --train_shards_path_or_url ${CONTROLNET_WDS_SHARDS}
      - --eval_shards_path_or_url ${CONTROLNET_WDS_SHARDS}
      - --max_train_samples 1024
      - --max_train_steps 1
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --mixed_precision bf16
    timeout_minutes: 300
  # Diffusion-ORPO SDXL LoRA（webdataset）。上游偏好数据集转私有，shard 由 setup
  # 合成（五件套键名与 get_dataset() rename 对应；1024 填满写死的 690 shuffle
  # 缓冲）。--dataloader_num_workers 默认 0 会除零，必须传 1。
  - path: examples/research_projects/diffusion_orpo/train_diffusion_orpo_sdxl_lora_wds.py
    profile: diffusers-orpo-wds
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_path ${ORPO_WDS_SHARDS}
      - --output_dir ${CI_OUTPUT_DIR}
      - --num_train_examples 1024
      - --max_train_steps 1
      - --resolution 512
      - --per_gpu_batch_size 1
      - --global_batch_size 1
      - --dataloader_num_workers 1
      - --gradient_checkpointing
      - --mixed_precision fp16
    timeout_minutes: 300

  # FLUX.2 Klein 4B LoRA（img2img）。同上。必须用带条件图列的数据集
  # （:1541 无条件取 cond_pixel_values）；且 Dataset 会把整个数据集急切物化进
  # 宿主内存（fill50k 1000 对直接吃穿 RAM → SIGKILL），故用 setup 合成的
  # 8 对数据集。
  - path: examples/dreambooth/train_dreambooth_lora_flux2_klein_img2img.py
    profile: diffusers-flux2-klein
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${FLUX2_KLEIN_MODEL_PATH}
      - --dataset_name ${FLUX2_KLEIN_DATASET}
      - --cond_image_column conditioning_image
      - --caption_column text
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --train_batch_size 1
      - --gradient_checkpointing
      - --mixed_precision bf16
      - --max_train_steps 1
    timeout_minutes: 300

  # Sana 1600M LoRA（单卡 a2-1）
  - path: examples/dreambooth/train_dreambooth_lora_sana.py
    profile: diffusers-sana
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers
      - --dataset_name lambdalabs/naruto-blip-captions
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240

  # PixArt-α ControlNet。T5-XXL 文本编码器，模型由 setup 预下（跳过用不上的
  # fp16 分片省一半）。--train_batch_size 默认 16 必须压 1；bf16 + 梯度检查点
  # 压显存。
  - path: examples/research_projects/pixart/train_pixart_controlnet_hf.py
    profile: diffusers-pixart
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${PIXART_MODEL_PATH}
      - --dataset_name fusing/fill50k
      - --output_dir ${CI_OUTPUT_DIR}
      - --train_batch_size 1
      - --mixed_precision bf16
      - --max_train_steps 1
    timeout_minutes: 240

  - path: examples/t2i_adapter/train_t2i_adapter_sdxl.py
    profile: diffusers-t2i-adapter
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name hf-internal-testing/fill10
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 64
      - --train_batch_size 1
      - --gradient_accumulation_steps 1
      - --max_train_steps 1
  #     # 验证阶段--validation_*会走cuda
    timeout_minutes: 240

  # SDXL LoRA
  - path: examples/text_to_image/train_text_to_image_lora_sdxl.py
    profile: diffusers-text-to-image
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name hf-internal-testing/dummy_image_text_data
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 64
      - --train_batch_size 1 --gradient_accumulation_steps 1 --max_train_steps 2
    timeout_minutes: 240

  # SDXL
  - path: examples/textual_inversion/textual_inversion_sdxl.py
    profile: diffusers-textual-inversion
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --train_data_dir ${FIXTURE_DIR}/images
      - --learnable_property object
      - --placeholder_token <cat-toy>
      - --initializer_token a
      - --output_dir ${CI_OUTPUT_DIR}
      - --save_steps 1 --num_vectors 2
      - --resolution 64
      - --train_batch_size 1 --gradient_accumulation_steps 1 --max_train_steps 2
    timeout_minutes: 240

  # Diffusion-DPO SDXL
  - path: examples/research_projects/diffusion_dpo/train_diffusion_dpo_sdxl.py
    profile: diffusers-sdxl-online
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name kashif/pickascore
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision fp16 --resolution 512
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240

  # Diffusion-ORPO SDXL LoRA
  - path: examples/research_projects/diffusion_orpo/train_diffusion_orpo_sdxl_lora.py
    profile: diffusers-sdxl-online
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name kashif/pickascore
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision fp16 --resolution 512
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240

  # scheduled_huber / dreambooth LoRA SDXL
  - path: examples/research_projects/scheduled_huber_loss_training/dreambooth/train_dreambooth_lora_sdxl.py
    profile: diffusers-sdxl-online
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --instance_data_dir ${FIXTURE_DIR}/images
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240

  # scheduled_huber / text_to_image LoRA SDXL
  - path: examples/research_projects/scheduled_huber_loss_training/text_to_image/train_text_to_image_lora_sdxl.py
    profile: diffusers-sdxl-online
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240

  # SDXL LoRA（单卡 a2-1）
  - path: examples/dreambooth/train_dreambooth_lora_sdxl.py
    profile: diffusers-sdxl
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name hf-internal-testing/dummy_image_text_data
      - --instance_prompt "a photo of sks dog"
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240
  # SDXL ControlNet（fill50k）。fp32：预计算嵌入经 datasets 序列化是 fp32，
  # 混精度在 SDPA 处 dtype 冲突；双卡 ZeRO-3 每卡 ~18GB。--max_train_samples 100：
  # 全量 1000 行在 map 预计算时一个 batch 全进 CLIP（激活 ~1.5GB），切片发生在
  # map 之前。
  - path: examples/controlnet/train_controlnet_sdxl.py
    profile: diffusers-controlnet-sdxl
    launcher: accelerate-deepspeed
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name fusing/fill50k
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --max_train_steps 1
      - --max_train_samples 100
    timeout_minutes: 240
  # SDXL 全量微调。bf16：fp32 在 DS ZeRO-2 初始化平坦缓冲处爆（~19GB/卡且每卡
  # 全量、加卡不减）；脚本 :1120 把嵌入 cast 成 weight_dtype，无 SDPA 冲突。
  - path: examples/text_to_image/train_text_to_image_sdxl.py
    profile: diffusers-sdxl-full
    launcher: accelerate-deepspeed
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name hf-internal-testing/dummy_image_text_data
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --mixed_precision bf16
      - --max_train_steps 1
    timeout_minutes: 240
  # InstructPix2Pix SDXL 全量。--seed 必传（:518 无条件 manual_seed）；bf16
  # 必传：脚本不 del 文本编码器/vae，fp32 叠加 ZeRO-2 平坦缓冲 >29.5GB OOM。
  # validation 双重守卫都不传，不跑 pipeline 推理。
  - path: examples/instruct_pix2pix/train_instruct_pix2pix_sdxl.py
    profile: diffusers-sdxl-full
    launcher: accelerate-deepspeed
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name fusing/instructpix2pix-1000-samples
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1
      - --gradient_checkpointing
      - --mixed_precision bf16
      - --max_train_steps 1
      - --seed 42
    timeout_minutes: 240

  # SDXL LPL（Latent Prompt Learning）。NPU fork：自带 torch_npu 适配 +
  # --enable_npu_flash_attention（diffusers 的 NPU 专属接口，唯一覆盖）。
  # 显存账同 t2i_sdxl（a2-2 + ZeRO-2 + bf16）。
  - path: examples/research_projects/lpl/train_sdxl_lpl.py
    profile: diffusers-sdxl-full
    launcher: accelerate-deepspeed
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path stabilityai/stable-diffusion-xl-base-1.0
      - --variant fp16
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --mixed_precision bf16
      - --train_batch_size 1
      - --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 240

  # Kandinsky 2.2 decoder（全量）。fp16：decoder 9.84GB fp32 + Adam 会 OOM。
  # 不传 --validation_prompts（否则加载 26.57GB 的 prior）。
  - path: examples/kandinsky2_2/text_to_image/train_text_to_image_decoder.py
    profile: diffusers-kandinsky
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --dataset_name lambdalabs/naruto-blip-captions
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --mixed_precision fp16                                  # decoder 9.84GB fp32 + Adam 状态会 OOM，转 fp16
      - --train_batch_size 1
      - --gradient_accumulation_steps 1
      - --gradient_checkpointing
      - --max_train_steps 1
    timeout_minutes: 180

  # SD1.5 多主体 inpainting DreamBooth。模型必须是 9 通道 inpainting 版（基础版
  # unet 4 通道，conv_in 报通道数不匹配）。Dataset 用 load_dataset 读本地目录，
  # 固定取 train/test split、列 image/prompt/mask，由 setup 生成。
  - path: examples/research_projects/multi_subject_dreambooth_inpainting/train_multi_subject_dreambooth_inpainting.py
    profile: diffusers-multi-subject-inpaint
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path ${SD15_INPAINT_PATH}
      - --instance_data_dir ${MULTI_SUBJECT_INPAINT_DATASET}
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 512
      - --train_batch_size 1
      - --max_train_steps 1
    timeout_minutes: 180

  # InstructPix2Pix LoRA（需显式列名 + seed）
  - path: examples/research_projects/instructpix2pix_lora/train_instruct_pix2pix_lora.py
    profile: diffusers-research-plain
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path timbrooks/instruct-pix2pix
      - --dataset_name instruction-tuning-sd/cartoonization
      - --original_image_column original_image
      - --edited_image_column cartoonized_image
      - --edit_prompt_column edit_prompt
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 256
      - --train_batch_size 1 --gradient_accumulation_steps 1 --gradient_checkpointing
      - --max_train_steps 1
      - --seed 42
    timeout_minutes: 180
  
  # GLIGEN text-box（SD1.5）。数据集是 torch.load 的 pth + 图片目录，setup
  # 合成极简 fixture（灰底图 + 1 框 + 零向量 embedding，后者是常量条件不进梯度）。
  - path: examples/research_projects/gligen/train_gligen_text.py
    profile: diffusers-gligen
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --data_path ${GLIGEN_DATA_PTH}
      - --image_path ${GLIGEN_IMAGE_DIR}
      - --output_dir ${CI_OUTPUT_DIR}
      - --resolution 512
      - --train_batch_size 1
      - --gradient_accumulation_steps 1
      - --max_train_steps 1
      - --mixed_precision no
    timeout_minutes: 180

  # CogVideoX-2b LoRA。模型 ModelScope 预下；Disney 数据集走 HuggingFace 直连。
  # 默认 480x720/49 帧在 29.5GB 卡上 OOM，压到 256x256/9 帧（(n-1)%4==0 约束）。
  - path: examples/cogvideo/train_cogvideox_lora.py
    profile: diffusers-cogvideo
