  # ===== OOM（显存溢出） ===================================================
  # 这些用例在 CI 的 a2-1/a2-4 等规格上因显存不足而 OOM 崩溃：
  # 1) LCM 全量蒸馏：teacher + 学生 + EMA target 三张 SDXL unet 同时驻留显存，
  #    bf16 后仍 ~27.7GB，加梯度 >30GB/卡 > 29.5GB；ZeRO-3 又被 transformers
  #    的 zero.Init 冻结模块 bug 打坏
  # 2) scheduled_huber 全量版：fork 缺 .to(dtype=weight_dtype)，DS 的 bf16/fp16
  #    不做 autocast → input fp32 与 bf16 权重在 conv_in 直接 dtype 冲突；
  #    纯 fp32 下 DS 初始化平坦缓冲 ~19GB 叠加 base 后 38GB > 29.5GB OOM
  # 3) LoRA SDXL LCM 蒸馏：forward 即 OOM（已分配 24.4GiB），DDP 不省单卡显存；
  #    ZeRO-3 又撞上游 bug——训练循环中 solver.ddim_step(...).to(unet.dtype)，
  #    模型被 DeepSpeedEngine 包裹后无 .dtype
  # 4) Qwen-Image（20B）+ ZeRO-3：host OOM（Signal 9 SIGKILL，内核 OOM killer）；
  #    去掉 offload_param 后仍 OOM（DeepSpeed 初始化仍要把整个模型+文本编码器放到 CPU）
  # 5) HiDream-I1-Dev（17B）+ ZeRO-3：:1140 在 prepare/分片之前无条件
  #    transformer.to(device)，整只 17B bf16 ≈ 32GB 往单卡搬（a2-4 实测：27.4GB
  #    已分配后 34MiB 都要不出）；每个 rank 执行同一整模型搬运，加卡无效。绕法
  #    只有让 zero.Init 在加载时分片，但那会打坏冻结、engine 不接管的 4 个文本
  #    编码器（SDXL CLIP 前科）。另：模型仓 ~44GB + Llama 镜像 ~15GB，无
  #    ModelScope 镜像，下载负担也重。回归条件：脚本 DS-aware（zero3 下跳过
  #    整模型 .to）或换更大显存（>36GB）机型
  - examples/consistency_distillation/train_lcm_distill_sdxl_wds.py
  - examples/research_projects/scheduled_huber_loss_training/text_to_image/train_text_to_image_sdxl.py
