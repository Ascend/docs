  # ===== Flax/JAX 系列 =======================================================
  # 以下都是训练脚本的 Flax/JAX 版本，跑不通有三层原因：
  # 1) diffusers 0.40 起删除了全部 Flax 类（FlaxUNet2DConditionModel 等），
  #    transformers 5.x 起删除了 FlaxCLIPTextModel，脚本开头的 import 就失败；
