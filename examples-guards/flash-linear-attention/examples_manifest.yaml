version: 1
supported:
  - source: project
    path: example/train_text.py
    profile: npu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.0.0-910b-ubuntu22.04-py3.11
    overlay_args:
      - --steps 20
      - --batch-size 2
      - --sequence-length 128
      - --max-new-tokens 32
    timeout_minutes: 120
unsupported: []
