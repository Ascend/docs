version: 1
# Liger-Kernel examples ledger. The engine tests the latest upstream release and
# setup installs Liger from that same checkout, so kernels and examples match.
# Stack: transformers==5.3.0 + trl==0.12.1 (v0.8.5 requires transformers>=5;
# trl 0.12.1 is the last release that accepts the examples' SFTTrainer kwargs).

scan:
  root: examples
  include_extensions: ['.py', '.sh']

supported:
  # 单卡 HF Trainer SFT；EfficiencyCallback 要求 --include_num_input_tokens_seen 与 --logging_steps 1。
  - path: examples/huggingface/training.py
    profile: liger_hf_trainer
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: ['--model_name ${LIGER_MODEL_PATH}', '--dataset ${LIGER_DATASET_PATH}', '--max_steps 3', '--per_device_train_batch_size 2', '--max_seq_length 256', '--eval_strategy no', '--save_strategy no', '--report_to none', '--logging_steps 1', '--include_num_input_tokens_seen', '--use_liger True', '--output_dir ${CI_OUTPUT_DIR}/hf_trainer']
    timeout_minutes: 180
  # 两卡 torchrun + FSDP（full_shard auto_wrap）配方。
  - path: examples/huggingface/run_qwen.sh
    profile: liger_hf_fsdp
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: ['--model_name ${LIGER_MODEL_PATH}', '--dataset ${LIGER_DATASET_PATH}', '--max_steps 2', '--per_device_train_batch_size 1', '--max_seq_length 256', '--bf16', '--eval_strategy no', '--save_strategy no', '--report_to none', '--logging_steps 1', '--include_num_input_tokens_seen', '--use_liger True', '--fsdp "full_shard auto_wrap"', '--fsdp_config config/fsdp_config.json', '--output_dir ${CI_OUTPUT_DIR}/hf_fsdp']
    timeout_minutes: 180

unsupported:
  # medusa 用 Trainer(tokenizer=...)，transformers 5 已改为 processing_class。
  - examples/medusa/train.py
  # from_pretrained(use_cache=False) 在 transformers 5 上必 TypeError。
  - examples/huggingface/training_multimodal.py

  # LigerORPOTrainer 的 _FSDPForwardRedirection 断言模型必须被 FSDP 包装。
  - examples/alignment/run_orpo.py

  # lightning 没有 npu accelerator，也没有可安装的插件包。
  - examples/lightning/training.py

  # Gemma-7B-it 是 gated 模型，无 HF token 时 403。
  - examples/huggingface/run_gemma.sh
  # Meta-Llama-3-8B 是 gated 模型，无 HF token 时 403。
  - examples/huggingface/run_llama.sh
  # 未覆盖数据集参数，会拉 168 GB 的 the_cauldron，90 分钟超时。
  - examples/huggingface/run_qwen2_vl.sh
  # 30 次 × 20 步复跑，2 小时超时。
  - examples/huggingface/run_benchmarks.sh

  # Megatron 内核替换，CUDA/NCCL 硬编码。
  - examples/megatron/run_mode1_monkey_patch.py
  # Megatron 手工层定义，CUDA/NCCL 硬编码。
  - examples/megatron/run_mode2_hand_spec.py

  # Modal 云 GPU 启动器。
  - examples/huggingface/launch_on_modal.py
  # medusa 启动包装，nvidia-smi 数卡 + CUDA FSDP 配置。
  - examples/medusa/scripts/llama3_8b_medusa.sh

  # training.py 的 EfficiencyCallback 辅助模块。
  - examples/huggingface/callback.py
  # medusa 的 EfficiencyCallback 辅助模块。
  - examples/medusa/callback.py
  # medusa 头注入工具模块。
  - examples/medusa/medusa_util.py
