# llama.cpp example guard for the shared engine in examples-template.yml.
# Profiles are implemented by scripts/setup_example.sh. Timeouts include a
# cold-cache budget: this runner pool does not have the source repo's
# pre-seeded weights. Entries that crash in ggml-cann, or that cannot
# prove the CANN device without editing upstream sources, are unsupported.
version: 1
scan:
  root: examples
  unit: directories
  marker: CMakeLists.txt
  max_depth: 1
supported:
  - path: examples/simple
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-simple
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
    timeout_minutes: 90
  - path: examples/passkey
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-passkey
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - --junk 16
      - -ngl 99
      - -v
    timeout_minutes: 90
  - path: examples/debug
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-debug
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
      - -c 256
      - --save-logits
      - --logits-output-dir ${CI_OUTPUT_DIR}
      - --no-warmup
      - -v
    timeout_minutes: 90
  - path: examples/eval-callback
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-eval-callback
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
    timeout_minutes: 90
  - path: examples/convert-llama2c-to-ggml
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-convert-llama2c-to-ggml
    overlay_args:
      - --llama2c-model ${FIXTURE_DIR}/stories260K.bin
      - --copy-vocab-from-model ${FIXTURE_DIR}/tok512.bin
      - --llama2c-output-model ${CI_OUTPUT_DIR}/stories260K.gguf
    timeout_minutes: 90
  - path: examples/gguf
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gguf
    timeout_minutes: 90
  - path: examples/gguf-hash
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gguf-hash
    overlay_args:
      - ${FIXTURE_DIR}/ci-demo.gguf
    timeout_minutes: 90
  - path: examples/gen-docs
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gen-docs
    timeout_minutes: 90
  # This leg downloads Dream safetensors and converts them. The shared
  # engine has no predecessor job, so the cold-cache budget lives here.
  - path: examples/diffusion
    profile: cann-diffusion
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-diffusion-cli
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
      - -c 64
      - -b 64
      - -ub 32
      - --diffusion-steps 4
      - --diffusion-eps 0.001
      - --diffusion-algorithm 4
      - -v
    timeout_minutes: 360
  - path: examples/simple-cmake-pkg
    profile: cmake-pkg
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/simple-cmake-pkg/build/llama-simple-cmake-pkg
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
    timeout_minutes: 120
unsupported:
  - examples/idle
  - examples/sycl
  - examples/training
  # simple-chat drops logs below ERROR, so the CANN device line never
  # appears. Showing it would mean editing upstream. Exit 0 alone would
  # be a false green.
  - examples/simple-chat
  # The read loop does not return on EOF, so one prompt hangs until the
  # job timeout. Making it return would mean editing retrieval.cpp.
  - examples/retrieval
  # PR run 38228583901, v0.6.0, CANN 9.1.0, Ascend910B3: ggml-cann aborts
  # in aclnnWeightQuantBatchMatmulV2 because y is not contiguous.
  - examples/batched
  - examples/embedding
  - examples/lookahead
  - examples/lookup
  - examples/speculative
  - examples/speculative-simple
  # Same run: FusedInferAttentionScore rejects a non-contiguous key in
  # the non-paged-attention path.
  - examples/parallel
