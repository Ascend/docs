# llama.cpp example guard for the shared engine in examples-template.yml.
# Profiles are implemented by scripts/setup_example.sh. Timeouts include a
# cold-cache budget: this runner pool does not have the source repo's
# pre-seeded weights. examples/simple-chat stays supported, but its success
# condition is exit 0 only — the upstream example drops non-error logs, so
# there is no CANN device line to grep, and this guard does not patch it.
version: 1
scan:
  root: examples
  unit: directories
  marker: CMakeLists.txt
  max_depth: 1
supported:
  - path: examples/simple
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-simple
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
    timeout_minutes: 90
  - path: examples/batched
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-batched
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 32
      - -np 4
      - -ngl 99
      - --kv-unified
    timeout_minutes: 90
  - path: examples/embedding
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-embedding
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p "Hello World!"
      - --pooling mean
      - -ngl 99
      - -c 256
    timeout_minutes: 90
  - path: examples/lookahead
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-lookahead
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
      - -c 512
      - -p "Hello my name is"
    timeout_minutes: 90
  - path: examples/lookup
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-lookup
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -c 256
      - -ngl 99
      - -p "the cat sat on the mat the cat sat on the mat"
      - --spec-draft-n-max 4
      - -lcd ${CI_OUTPUT_DIR}/lookup-dyn.bin
    timeout_minutes: 90
  - path: examples/parallel
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-parallel
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -np 2
      - -ns 4
      - --junk 1
      - -pps
      - -c 4096
      - -ngl 99
    timeout_minutes: 90
  - path: examples/speculative
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-speculative
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -md ${LLAMA_CI_MODEL}
      - -p Hello
      - -n 16
      - -c 256
      - -ngl 99
      - -ngld 99
      - --temp 0
      - --spec-draft-n-max 2
    timeout_minutes: 90
  - path: examples/speculative-simple
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-speculative-simple
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -md ${LLAMA_CI_MODEL}
      - --spec-type draft-simple
      - -p Hello
      - -n 16
      - -c 256
      - -ngl 99
      - -ngld 99
      - --temp 0
      - --spec-draft-n-max 2
      - --top-k 1
    timeout_minutes: 90
  - path: examples/passkey
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-passkey
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - --junk 16
      - -ngl 99
      - -v
    timeout_minutes: 90
  - path: examples/debug
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-debug
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
      - -c 256
      - --save-logits
      - --logits-output-dir ${CI_OUTPUT_DIR}
      - --no-warmup
      - -v
    timeout_minutes: 90
  - path: examples/eval-callback
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-eval-callback
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
    timeout_minutes: 90
  - path: examples/simple-chat
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-simple-chat
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -c 512
      - -ngl 99
    timeout_minutes: 90
  - path: examples/retrieval
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-retrieval
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -ngl 99
      - --pooling mean
      - --context-file ${TARGET_ROOT}/README.md
      - --chunk-size 100
      - --chunk-separator .
      - --top-k 1
      - -c 512
      - -b 512
    timeout_minutes: 90
  - path: examples/convert-llama2c-to-ggml
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-convert-llama2c-to-ggml
    overlay_args:
      - --llama2c-model ${FIXTURE_DIR}/stories260K.bin
      - --copy-vocab-from-model ${FIXTURE_DIR}/tok512.bin
      - --llama2c-output-model ${CI_OUTPUT_DIR}/stories260K.gguf
    timeout_minutes: 90
  - path: examples/gguf
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gguf
    timeout_minutes: 90
  - path: examples/gguf-hash
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gguf-hash
    overlay_args:
      - ${FIXTURE_DIR}/ci-demo.gguf
    timeout_minutes: 90
  - path: examples/gen-docs
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-gen-docs
    timeout_minutes: 90
  # This leg downloads Dream safetensors and converts them. The shared
  # engine has no predecessor job, so the cold-cache budget lives here.
  - path: examples/diffusion
    profile: cann-diffusion
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/llama-diffusion-cli
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -p hello
      - -ngl 99
      - -c 64
      - -b 64
      - -ub 32
      - --diffusion-steps 4
      - --diffusion-eps 0.001
      - --diffusion-algorithm 4
      - -v
    timeout_minutes: 360
  - path: examples/simple-cmake-pkg
    profile: cmake-pkg
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/simple-cmake-pkg/build/llama-simple-cmake-pkg
    overlay_args:
      - -m ${LLAMA_CI_MODEL}
      - -n 16
      - -ngl 99
    timeout_minutes: 120
unsupported:
  - examples/idle
  - examples/sycl
  - examples/training
