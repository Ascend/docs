version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  # 压缩推理。device_map=auto，装了 torch_npu 后权重和输入应在 npu:0。FP8 解压失败是诚实红。
  - path: examples/compressed_inference/fp8_compressed_inference.py
    profile: npu_inference
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 90
  # 单卡 oneshot。脚本在 CUDA 机器上会用 GPU，这里装 torch_npu，计算落到 npu。退出码 0 但参数不在 npu 上判红。不改 example 文件。
