version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  # 单卡 oneshot。脚本在 CUDA 机器上会用 GPU，这里装 torch_npu，计算落到 npu。退出码 0 但参数不在 npu 上判红。不改 example 文件。
  # Qwen3-8B 共 36 层，AutoRound 校准实测 104 分钟，后续 MXFP4 伪量化逐词生成 100 个 token 参照同类 llama3_mxfp4 的 144 分钟推算约 162 分钟，总耗时约 275 分钟，超时设为 360 分钟。运行日志 https://github.com/Ascend/docs/actions/runs/38372545244/job/115213535243
  - path: examples/autoround/quantization_w4a4_mxfp4/autoround_example.py
    profile: npu_oneshot
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 360
