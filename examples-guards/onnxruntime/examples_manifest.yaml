  - python/AzureEP/create_hybrid_model.py
  # tiny_yolov2_obj_detection_sample.py calls add_openvino_libs_to_path() and InferenceSession(..., providers=['OpenVINOExecutionProvider']).
  - python/OpenVINO_EP/tiny_yolo_v2_object_detection/tiny_yolov2_obj_detection_sample.py
  # yolov4.py calls add_openvino_libs_to_path() and InferenceSession(..., providers=['OpenVINOExecutionProvider']).
  - python/OpenVINO_EP/yolov4_object_detection/yolov4.py
  # compile_api.py defaults --provider to NvTensorRTRTXExecutionProvider and compiles with session_options.add_provider.
  - python/api/compile_api.py
  # device_bindings.py calls OrtValue.ortvalue_from_numpy(..., 'gpu', ...) and bind_input(..., device_type="gpu").
  - python/api/device_bindings.py
  # export.py only runs BertForQuestionAnswering.from_pretrained("bert-large-uncased-whole-word-masking-finetuned-squad") and torch.onnx.export. It never creates an InferenceSession.
  - python/azureml/export.py
  # score.py sets model_dir = os.getenv('AZUREML_MODEL_DIR') and loads the session from that Azure ML deploy path.
  - python/azureml/score.py
  # aml_submit_mistral_inference.py constructs azure.ai.ml.MLClient with AzureCliCredential and submits an Azure ML command job.
  - python/models/mistral/aml_submit_mistral_inference.py
  # replace_fp64.py only rewrites FP64 initializers to FP32 via convert_fp64_to_fp32. It takes input_dir and output_dir and opens no session.
  - python/models/stable_difusion/replace_fp64.py
  # run_sd.py defaults --execution_provider to NvTensorRTRTXExecutionProvider and times the run with torch.cuda.Event.
  - python/models/stable_difusion/run_sd.py
  # resnet50_data_reader.py defines class ResNet50DataReader and has no __main__. run.py imports it.
  - quantization/image_classification/cpu/resnet50_data_reader.py
  # run_qdq_debug.py requires --float_model and --qdq_model, then calls qdq_loss_debug.collect_activations to compare the two models.
  - quantization/image_classification/cpu/run_qdq_debug.py
  # e2e_migraphx_resnet_example.py sets execution_provider to ["MIGraphXExecutionProvider"] and calibrator.set_execution_providers(["ROCMExecutionProvider"]).
