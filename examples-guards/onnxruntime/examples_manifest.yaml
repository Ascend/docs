  # evaluation/main.py builds ORTCausalLM from --model_args, whose help text is a folder of a pre-trained ONNX model. That folder is not in the repo.
  - quantization/language_model/evaluation/main.py
  # ort_lm.py defines class ORTCausalLM and has no __main__. Its device_list is ["cuda", "cpu"] plus cuda:{i}, and the fallback is torch.device("cuda") when CUDA is available.
