version: 1
# Checkout is microsoft/onnxruntime-inference-examples. That repo has
# no GitHub releases; the engine falls back to the default branch.
# scan.root is the repo root because supported units live under both
# python/ and quantization/.
#
# Both supported entries are host-CPU scripts that happen to run on an
# NPU runner. A green result is the script's own output, not CANN
# inference. Do not install onnxruntime-cann or torch_npu for them:
# quantize_static opens its own session and would move calibration
# onto the NPU if the CANN wheel is present.
scan:
  root: .
  include_extensions: ['.py']
supported:
  - path: python/api/getting_started.py
    profile: cpu-python
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 30
  - path: quantization/image_classification/cpu/run.py
    profile: quant-cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --input_model
      - ${TARGET_ROOT}/quantization/image_classification/cpu/mobilenetv2-7.onnx
      - --output_model
      - ${CI_OUTPUT_DIR}/mobilenetv2-7.quant.onnx
      - --calibrate_dataset
      - ${TARGET_ROOT}/quantization/image_classification/cpu/test_images
    timeout_minutes: 30
unsupported:
  # Other Python inference samples. CUDA / OpenVINO / Azure / TensorRT.
  - python/AzureEP/create_hybrid_model.py
  - python/OpenVINO_EP/tiny_yolo_v2_object_detection/tiny_yolov2_obj_detection_sample.py
