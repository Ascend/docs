version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py']  
  # 仅 .sh/.py；peft/examples 下的所有 .yaml 都是 accelerate/deepspeed/fsdp 运行配置，非 training recipe，不纳入审计
  # files-only 模型：扫描范围是 examples/ 下的 .sh/.py

supported:
  # ===== 排序约定：按 run 35575049729 实际耗时降序 =====
  # 同耗时下保留原顺序（stable sort）。adalora_seq2seq 65 min 领跑、
  # lora_ga/mica/adamss_image/psoft/semantic_search/kasa/shadow/dora
  # 几条长腿填前 8 slot（max_parallel=8），让首批并发跑长腿、短腿填后
  # 续空闲 slot，整轮 wall-clock 被最长腿（adalora）单一决定；调换
  # 之前 lora_ga/mica/adamss_image 在第 2-5 批串行排队 ≈ 5–25 min。
  # 再次实测后若耗时分布再变，照实测重排（不要按 timeout 倒序：
  # run_peft.sh timeout 90 实际只跑 4.9 min；mica timeout 30 实际 29.3 min）。
  # AdaLoRA seq2seq：零 CLI 入口（模块常量 facebook/bart-base + 8 epochs +
  # bs 8），npu-5 原样实跑 exit 0（8 epochs 训完 + accuracy 打印 + adapter
  # 落盘 + 末段 generate 复现）。全量 ≈105-110 min（1074 步/epoch @~2.6 it/s
  # + 每 epoch eval），是全部条目中最长的腿，timeout 120。模型 facebook/bart-base
  # 与数据集 zeroshot/twitter-financial-news-sentiment 在运行时从
  # huggingface.co 下载进共享缓存。
  # pin_memory=True 纯 DataLoader（无 accelerator.prepare）实测不挂。
  - path: examples/conditional_generation/peft_adalora_seq2seq.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    timeout_minutes: 120

  # MonteCLoRA 序列分类：原判 evaluate.load("glue","mrpc") import 时挂
  # （:33）——那是 npu-3 裸跑离线环境；CI 环境下 evaluate metric 走
  # hf-mirror 小文件正常（与 adamss_image 同路径）。npu-1 实跑 1 epoch
  # 173s exit 0，eval_accuracy 0.74 / eval_f1 0.83（glue 真 metric）。
  # glue/mrpc 数据与 roberta-base 均在 seed 缓存

  # LoRA-GA：0.5B + wikitext-2（默认 gpt2 换 seed 的 0.5B，target_modules
  # 换 Qwen 系；c_attn 是 gpt2 专用）。梯度估计（device 分支）+ 4590 步
  # 全量 1 epoch 训练 + adapter 落盘，npu-5 实跑 30.7min exit 0
  # （train_loss 4.43）。eval/save_steps 拉满跳过中途评估与存点（只留最终
  # save_pretrained）；num_epochs 默认 3 压到 1。
  - path: examples/lora_ga_finetuning/lora_ga_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --target_modules q_proj k_proj v_proj o_proj
      - --grad_estimate_iters 8
      - --num_epochs 1
      - --eval_steps 1000000
      - --save_steps 1000000
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60

  # AdaLoRA seq2seq：零 CLI 入口（模块常量 facebook/bart-base + 8 epochs +
  # bs 8），npu-5 原样实跑 exit 0（8 epochs 训完 + accuracy 打印 + adapter
  # 落盘 + 末段 generate 复现）。全量 ≈105-110 min（1074 步/epoch @~2.6 it/s
  # + 每 epoch eval），是全部条目中最长的腿，timeout 120。模型 facebook/bart-base
  # 与数据集 zeroshot/twitter-financial-news-sentiment 在运行时从
  # huggingface.co 下载进共享缓存。
  # pin_memory=True 纯 DataLoader（无 accelerator.prepare）实测不挂。

  # MiCA：同上配方（Qwen2.5-0.5B + imdb 1% + nll）
  - path: examples/mica_finetuning/mica_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}   # HfArgumentParser 必填：注入 0.5B
      - --loss_type nll   # 同 miss：mica_finetuning.py:52 同样 device_map="auto" 触发 accelerate add_hook_to_module；chunked_nll patch 在 functools.partial 上 inspect.signature(__func__) 崩
    timeout_minutes: 30

  # PVeRa：dinov2-base + beans，原样跑通

  # AdaMSS image：vit-base + cifar10；coder npu-3 2026-09-17 实跑 e2e 通过
  # train 625 steps @1.34 it/s ≈7.5min + best eval exit (eval_acc=0.0 因 _StubAccuracy 总是返回 0);
  # 3 patch：(1) `model = model.to("npu")` 在 AdaMSSConfig 构造之前（AdaMSS layer.py device=weight.device，
  #   不 patch 永远 CPU SVD）；(2) stub evaluate.load("accuracy") 同 [[peft-monteclora-evaluate-load-hangs-offline]]；
  # (3) PYTHONPATH=/home/coder/work/peft-b-venv/stubs 提供 torchvision.transforms stub（pytorch.org/whl/cpu
  #   的 torchvision 0.22-0.29 与 torch 2.9.0+cpu ABI 不匹配，见 [[torchvision-v29-stable-abi]]）。
  # 以上 3 patch 均为 coder 验证机本地补丁，CI 不需要：(1) 脚本不 .to()，get_peft_model
  #   时权重在 CPU 上做 SVD（等价），Trainer 再搬 NPU；(2) evaluate.load 走 hf-mirror
  #   小文件（glue_adamss_asa 同用法已过）；(3) CI 装 aarch64 torchvision 0.27.0 与
  #   torch 2.12.0 ABI 匹配（2026-09-20 随整栈升 2.12 同步，见 setup_example.sh）。
  # CI 资产（run 35222723526 302 cas-bridge 超时根因）：脚本 DATASET_CONFIGS["cifar10"]
  #   硬编码 Multimodal-Fatima/CIFAR10_train + CIFAR10_test（不是 uoft-cs/cifar10），
  #   模型默认 google/vit-base-patch16-224-in21k —— ModelScope 均无镜像，运行时
  #   从 huggingface.co 下载进共享缓存。
  # test eval 全量 10000 samples/1250 steps 长跑 ≈15min 是脚本默认行为（无 max_eval_samples 参数）；
  - path: examples/adamss_finetuning/image_classification_adamss_asa.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --max_train_samples 200   # 默认整 cifar10 train 50k：压到 200 = 25 step 即可验证
      - --num_epochs 1            # 默认 10：压训练
      - --batch_size 8            # 默认 32：910B4 单卡 32GB 够
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # PiSSA：Qwen2.5-0.5B + ci_alpaca_10 fixture + trl 1.12 NLL loss，
  # 1 epoch 5.17s exit 0（loss 5.33→1.59）。
  # 关键 overlay：--loss_type nll 绕开 [[trl-chunked-nll-functools-partial-bug]]
  # （pissa 用 device_map="auto" 触发 accelerate.add_hook_to_module 把 forward
  # 包成 functools.partial，trl chunked_nll inspect.signature(__func__) 崩）；
  # --bits bf16（脚本默认 fp32，省内存）
  # data_path 复用 waveft 同款 ci_alpaca_10（目录 + train.jsonl，字段
  # instruction/input/output——alpaca 标准格式）；run 35303810367 曾指向
  # 不存在的 ci_alpaca_10_dir（fixture 从未提交），字段名本身没错。

  # PSoft：原判"trl 1.10 可跑、1.12 backward 崩"版本敏感——1.12 崩点实为
  # chunked_nll 与 device_map="auto" 的组合（同 miss/mica），--loss_type nll
  # 后通过。npu-1 5 步 exit 0（loss 3.31）
  - path: examples/psoft_finetuning/psoft_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}
      - --loss_type nll
      - --max_steps 5
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # Shadow：原判"8B fp32 主机 RAM OOM"——换 0.5B 即解；:59 设备分支
  # torch.device("cuda" if ...) 在 shim 下直通 NPU。内置 3 条 toy texts
  # 无数据依赖，默认 5 步。npu-1 exit 0（loss 10.3→7.3，adapter 落盘，
  # 末段 reloaded_base 复现加载）

  # 语义检索 LoRA：原判两坑（pin_memory+accelerator.prepare 挂 do_sys_poll、
  # evaluate.load("roc_auc") 离线挂）均为 npu-3 裸跑环境假象——npu-1 标准
  # shim 下原样通过：pin_memory 不挂、roc_auc 走 hf-mirror 真值 0.767。
  # sanity_test 走 smangrul/amazon_esci 前 1024 行（运行时 mirror 下载）。
  # 注意 --sanity_test/--use_peft 是 store_true 裸开关（hra 教训：不能带值）
  - path: examples/feature_extraction/peft_lora_embedding_semantic_search.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --model_name_or_path sentence-transformers/all-MiniLM-L6-v2   # seed 已种（bare id 走 hub cache 解析）
      - --sanity_test
      - --use_peft
      - --num_train_epochs 1
      - --per_device_train_batch_size 16
      - --per_device_eval_batch_size 16
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # KaSA（SVD 正则 LoRA）：原"backward ERR00100 归因待复跑"是 npu-3 裸跑
  # 环境假象。与 miss/mica 同构（SFTConfig 子类 + device_map="auto" +
  # imdb 1%），同配方 --loss_type nll 绕 chunked_nll；a2-1 单卡下
  # device_map 全落 npu:0。npu-1 实跑 5 步 exit 0（loss 6.83 含 kasa 正则项）

  # KaSA（SVD 正则 LoRA）：原"backward ERR00100 归因待复跑"是 npu-3 裸跑
  # 环境假象。与 miss/mica 同构（SFTConfig 子类 + device_map="auto" +
  # imdb 1%），同配方 --loss_type nll 绕 chunked_nll；a2-1 单卡下
  # device_map 全落 npu:0。npu-1 实跑 5 步 exit 0（loss 6.83 含 kasa 正则项）
  - path: examples/kasa_finetuning/kasa_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}
      - --loss_type nll   # device_map="auto" 触发 functools.partial forward，trl 1.12 chunked_nll 崩（同 miss/mica）
      - --max_steps 5
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # UniLoRA：同 kasa 配方（原 backward 崩同为环境假象），npu-1 5 步 exit 0

  # Shadow：原判"8B fp32 主机 RAM OOM"——换 0.5B 即解；:59 设备分支
  # torch.device("cuda" if ...) 在 shim 下直通 NPU。内置 3 条 toy texts
  # 无数据依赖，默认 5 步。npu-1 exit 0（loss 10.3→7.3，adapter 落盘，
  # 末段 reloaded_base 复现加载）
  - path: examples/shadow_finetuning/shadow_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}   # 默认 Qwen/Qwen3-8B（fp32 32GB 必 OOM）：换 0.5B
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # LoRA-FA：原判":52-60 设备分支无 npu → device_map='cpu' 主机内存"——
  # shim 下 torch.cuda.is_available()→True → cuda 分支 → device_map="cuda"
  # 映射 NPU，bf16 探测同路径通过。数据 query/response 字段走新 fixture
  # ci_query_response_8（单文件，shim 映射 train/test，:118 自切 val）。
  # npu-1 1 epoch exit 0（loss 2.68）

  # DoRA（训练脚本，区别于已支持的 dora-caching.py）：同 gralora 配方
  # （npu-5 exit 0，loss 2.37）
  - path: examples/dora_finetuning/dora_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model ${SFT_MODEL_PATH}
      - --data_path ${TARGET_ROOT}/fixtures/ci_text_8_hf
      - --num_epochs 1
      - --batch_size 1
      - --cutoff_len 256
      - --val_set_size 1
      - --learning_rate 1e-4
      - --output_dir ${CI_OUTPUT_DIR}
      - --device npu:0
      - --eval_step 100
      - --save_step 100
    timeout_minutes: 30

  # RoAD：同 dora 配方，**必须 a2-1 单卡**——:76 device_map="auto" 在 2 卡
  # 会把模型切开（mat1 npu:1 vs npu:0 崩），单卡全部落 npu:0

  # SD dreambooth + stable_diffusion full LoRA：脚本用 argparse subparsers，
  # overlay 关键：父 parser flag 全部在前，"lora" 子命令放最后
  # （父 args 在子 parser 之前生效，lora 子 parser 仅接收 --unet_r/--unet_alpha 等）
  # 10 steps exit 0（loss 0.0247，17s）
  - path: examples/stable_diffusion/train_dreambooth.py
    profile: peft_dreambooth
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --pretrained_model_name_or_path ${SD_MODEL_PATH}
      - --instance_data_dir ${TARGET_ROOT}/fixtures/ci_dummy_image
      - --instance_prompt 'a photo of sks dog'
      - --max_train_steps 10
      - --train_batch_size 1
      - --report_to tensorboard
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision no
      - --resolution 256
      - --center_crop
      - lora
    timeout_minutes: 30

  # SD dreambooth + HRA：10 steps exit 0（loss 0.00388，1m10s，npu-5 复验）。
  # v0.21.0 脚本两个坑（均 overlay/setup 绕过，0 patch）：
  # (1) :89 Accelerator(project_dir=ProjectConfiguration(...)) 传错 kwarg
  #     （应为 project_config=）→ accelerate 1.15 init_trackers 在
  #     os.path.join(ProjectConfiguration, run_name) 上 TypeError。
  #     绕过：--report_to none → 脚本 :91 log_with=None → trackers 为空，
  #     init_trackers 变 no-op（wandb 分支同崩溃路径，无关 tensorboard）。
  # (2) :316-319 cwd/data/dreambooth 不存在时无条件 git clone
  #     github.com/google/dreambooth（runner 网络不通；该路径在脚本里只用于
  #     clone 自身，纯死代码）。绕过：setup_peft_dreambooth 预 mkdir。
  # 注意：args_loader 的开关类参数（--push_to_hub/--center_crop 等）是
  # store_true 无值开关，overlay 不能带值（run 35482204039 曾因
  # `--push_to_hub False` 报 unrecognized arguments: False）。

  # BOFT dreambooth：SD v1.5 + ci_dummy_image + BOFTConfig。与 hra_dreambooth
  # 同构（utils/args_loader.py + Accelerator），但 v0.21.0 脚本比 hra 少两处
  # 修复，**零源码 patch 绕过**（2026-09-21 npu-2 实测定论）：
  # - :391 init_trackers(...init_kwargs=wandb_init) 无 guard、wandb_init 只在
  #   report_to=="wandb" 分支定义 → 走 --report_to wandb 让 wandb_init 有值；
  # - wandb_init 硬编码 mode="online" 会要求登录 → run_example.sh 的
  #   sitecustomize wandb neutralizer 把 wandb.init 强制 disabled（no-op run）。
  # overlay 关键：--use_boft 是 store_true 必须显式开；--wandb_run_name 必传
  # （adapter_name=None 会让 get_peft_model 崩 TypeError）；--validation_prompt
  # 必传（脚本 :88 无条件 args.validation_prompt[0]）。
  # 2026-09-21 npu-2 单卡 2.12 零 patch 实跑 10 步 exit 0（loss 0.0376）。
  - path: examples/boft_dreambooth/train_dreambooth.py
    profile: peft_dreambooth
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --pretrained_model_name_or_path ${SD_MODEL_PATH}
      - --instance_data_dir ${TARGET_ROOT}/fixtures/ci_dummy_image
      - --instance_prompt 'a photo of sks dog'
      - --validation_prompt 'a photo of sks dog'   # :88 无条件访问
      - --wandb_run_name boft-run                  # adapter_name=None 崩
      - --wandb_project_name boft-proj
      - --use_boft                                # store_true：不开就是裸 UNet 全参微调
      - --max_train_steps 10
      - --train_batch_size 1
      - --report_to wandb   # 零 patch 关键：wandb 分支定义 wandb_init，shim 中性化 login
      - --output_dir ${CI_OUTPUT_DIR}
      - --mixed_precision no
      - --resolution 256
      - --center_crop
      - --checkpointing_steps 1000000
    timeout_minutes: 30

  # t5-base seq2seq LoRA（Accelerator 裸跑，FSDP 分支需 launcher 才激活）：
  # 零 CLI 硬编码 t5-base + 本地 FinancialPhraseBank 两个 jsonl
  # （temp/data/FinancialPhraseBank-v1.0/，setup_peft 从仓内 fixture 放置）。
  # t5-base 在运行时从 huggingface.co 下载进共享缓存，裸 id 走 hub cache
  # 解析。

  # PiSSA：Qwen2.5-0.5B + ci_alpaca_10 fixture + trl 1.12 NLL loss，
  # 1 epoch 5.17s exit 0（loss 5.33→1.59）。
  # 关键 overlay：--loss_type nll 绕开 [[trl-chunked-nll-functools-partial-bug]]
  # （pissa 用 device_map="auto" 触发 accelerate.add_hook_to_module 把 forward
  # 包成 functools.partial，trl chunked_nll inspect.signature(__func__) 崩）；
  # --bits bf16（脚本默认 fp32，省内存）
  # data_path 复用 waveft 同款 ci_alpaca_10（目录 + train.jsonl，字段
  # instruction/input/output——alpaca 标准格式）；run 35303810367 曾指向
  # 不存在的 ci_alpaca_10_dir（fixture 从未提交），字段名本身没错。
  - path: examples/pissa_finetuning/pissa_finetuning.py
    profile: peft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.10
    overlay_args:
      - --base_model_name_or_path ${SFT_MODEL_PATH}
      - --bits bf16
      - --data_path ${TARGET_ROOT}/fixtures/ci_alpaca_10
      - --dataset_field instruction output
      - --dataset_split 'train[:100%]'
      - --max_steps 5
      - --num_train_epochs 1
      - --per_device_train_batch_size 1
      - --gradient_accumulation_steps 1
      - --learning_rate 1e-4
      - --max_length 512
      - --logging_steps 1
      - --save_strategy no
      - --report_to none
      - --loss_type nll
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 30

  # DeFT：Qwen2.5-0.5B + ci_text_8_hf fixture + npu:0 1 epoch 5s 内 exit 0
  # （loss 1.86）。
  # 注：原 C-7B-FA-family"族推断"理论**实测不成立**——脚本默认模型即 Qwen2.5-0.5B
  # 而非 7B；910B4 单卡 32G 完全够；未触发 aclnn 207001（脚本未硬编码 flash_attention_2）

  # FP4（bnb 4-bit NF4 QLoRA）：零 CLI 模块级脚本，硬编码 facebook/opt-350m
  # + Abirate/english_quotes 数据 + fp16=True + OPT 专属 target_modules。
  # 无需 overlay/patch——模型 facebook/opt-350m 与 2508 行的小数据集都在
  # 运行时从 huggingface.co 下载进共享缓存。
  # 关键：本条目是唯一走 bnb 的 supported 例（profile peft_fp4 专装 bnb），
  # run_example.sh 的 SKIP_TRANSFER_TO_NPU 白名单（fp4_finetuning/ 目录）
  # 对它跳过 transfer_to_npu——bnb 0.50.2 默认 CPU 后端在 NPU 上跑 4-bit
  # NF4，挂 transfer_to_npu 反而让 bnb 误走 cuda backend 崩。fp16=True 由
