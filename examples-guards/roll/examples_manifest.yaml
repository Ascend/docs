      - '--config_name'
      - 'agentic_val_sokoban'
      - '++exp_name="roll-ci-agentic-train"'
      - '++transfer_backend.backend_name=null'
      - '++logging_dir="${oc.env:CI_OUTPUT_DIR}/logs"'
      - '++output_dir="${oc.env:CI_OUTPUT_DIR}/output"'
      - '++system_envs.MODEL_DOWNLOAD_TYPE="MODELSCOPE"'
      - '++checkpoint_config.output_dir="${oc.env:CI_OUTPUT_DIR}/ckpt"'
      - '++num_gpus_per_node=2'
      - '++max_steps=1'
      - '++save_steps=10'
      - '++eval_steps=1000'
      - '++track_with="stdout"'
      - '++rollout_batch_size=2'
      - '++val_batch_size=2'
      - '++sequence_length=256'
      - '++pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++reward_pretrain="${oc.env:ROLL_MODEL_PATH}"'
      - '++actor_train.training_args.per_device_train_batch_size=1'
      - '++actor_train.training_args.gradient_accumulation_steps=1'
      - '++actor_train.training_args.warmup_steps=0'
      - '++actor_train.training_args.lr_scheduler_type="constant"'
      - '++actor_train.strategy_args.strategy_name="fsdp2_train"'
      - '~actor_train.strategy_args.strategy_config'
      - '++actor_train.strategy_args.strategy_config={fsdp_size:1,param_dtype:"bf16",reduce_dtype:"bf16",reshard_after_forward:true,offload_policy:false}'
      - '++actor_train.device_mapping="list(range(0,1))"'
      - '++actor_train.infer_batch_size=1'
      - '++actor_infer.generating_args.max_new_tokens=32'
      - '++actor_infer.strategy_args.strategy_config={gpu_memory_utilization:0.8,block_size:16,load_format:"auto",max_model_len:256,enforce_eager:true}'
      - '++actor_infer.device_mapping="list(range(1,2))"'
      - '++reference.device_mapping="list(range(0,1))"'
      - '++reference.infer_batch_size=1'
      - '++reward_normalization.norm_mean_type="group"'
      - '++reward_normalization.norm_std_type="group"'
      - '++train_env_manager.max_env_num_per_worker=2'
      - '++train_env_manager.num_env_groups=1'
      - '++train_env_manager.group_size=2'
      - '++train_env_manager.num_groups_partition=[1]'
      - '++val_env_manager.max_env_num_per_worker=1'
      - '++val_env_manager.num_env_groups=1'
      - '++val_env_manager.tags=["SimpleSokoban"]'
      - '++val_env_manager.num_groups_partition=[1]'
      - '++max_tokens_per_step=32'
      - '++max_actions_per_traj=2'
      - '~custom_envs'
      - '++custom_envs={SimpleSokoban:"${custom_env.SimpleSokoban}"}'
      - '++render_save_dir=""'
      - '~tracker_kwargs'
    timeout_minutes: 240
