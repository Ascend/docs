      - "--attention-backend flash"
      - "--optimizer adam"
      - "--lr 1e-5"
      - "--lr-decay-style cosine"
      - "--min-lr 1e-6"
      - "--weight-decay 0.1"

  # Megatron OPD：真实教师前向蒸馏；本地小模型 checkpoint，训练与 rollout 分卡运行。
  - path: examples/on_policy_distillation/run-qwen3-8B-opd-megatron.sh
