version: 1
# 清单以 Ascend/slime-ascend 的 examples/ 为基准；supported 路径也须存在于 THUDM/slime release。
scan:
  root: examples
  include_extensions: ['.sh', '.py']
supported:
  # run-qwen2.5-0.5B-fully_async.sh：全异步训练；有 fork NPU 测试先例，可压缩到四卡 CI。
  - path: examples/fully_async/run-qwen2.5-0.5B-fully_async.sh
    profile: slime_fully_async
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
    overlay_args:
      - "--hf-checkpoint ${SLIME_MODEL_PATH}"
      - "--ref-load ${SLIME_TORCH_DIST_PATH}"
      - "--prompt-data ${SLIME_FIXTURE_JSONL}"
      - "--rollout-function-path slime.rollout.fully_async_rollout.generate_rollout_fully_async"
      - "--input-key prompt"
      - "--label-key label"
      - --apply-chat-template
      - "--rm-type deepscaler"
      - "--rollout-temperature 0.8"
      - "--attention-dropout 0.0"
      - "--hidden-dropout 0.0"
      - "--num-rollout 2"
      - "--rollout-batch-size 4"
      - "--global-batch-size 16"
      - "--rollout-max-response-len 1024"
      - "--n-samples-per-prompt 4"
      - "--actor-num-gpus-per-node 1"
      - "--rollout-num-gpus 3"
      - "--sglang-device npu"
      - "--sglang-mem-fraction-static 0.65"
      - "--sglang-cuda-graph-max-bs 16"
      - "--max-tokens-per-gpu 4096"
      - --use-dynamic-batch-size
      - --sequence-parallel
      - --accumulate-allreduce-grads-in-fp32
      - --attention-softmax-in-fp32
      - "--attention-backend flash"
      - --ci-test

  # run-qwen3-8B-opd.sh：SGLang teacher 的 OPD 蒸馏；有 fork NPU 测试先例，可缩至八卡 CI。
  - path: examples/on_policy_distillation/run-qwen3-8B-opd.sh
    profile: slime_opd
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
    overlay_args:
      - "--hf-checkpoint ${SLIME_MODEL_PATH}"
      - "--ref-load ${SLIME_TORCH_DIST_PATH}"
      - --use-dist-ckpt
      - "--prompt-data ${SLIME_FIXTURE_JSONL}"
      - "--input-key prompt"
      - "--label-key label"
      - --apply-chat-template
      - "--custom-rm-path slime.rollout.on_policy_distillation.reward_func"
      - "--custom-reward-post-process-path slime.rollout.on_policy_distillation.post_process_rewards"
      - "--rm-url ${SLIME_TEACHER_URL}"
      - --use-opd
      - "--opd-type sglang"
      - "--opd-kl-coef 1.0"
      - "--rollout-temperature 0.8"
      - "--attention-dropout 0.0"
      - "--hidden-dropout 0.0"
      - "--num-rollout 2"
      - "--rollout-batch-size 4"
      - "--n-samples-per-prompt 4"
      - "--global-batch-size 16"
      - "--rollout-max-response-len 1024"
      - "--actor-num-gpus-per-node 4"
      - "--rollout-num-gpus 3"
      - "--sglang-device npu"
      - "--sglang-mem-fraction-static 0.6"
      - "--sglang-cuda-graph-max-bs 16"
      - "--max-tokens-per-gpu 4096"
      - --use-dynamic-batch-size
      - "--megatron-to-hf-mode bridge"
      - --use-flash-attn
      - "--attention-backend flash"
      - --ci-test

  # retool_qwen3_4b_rl.sh：工具调用强化学习；八卡隔离训练与推理，短 rollout 验证。
  - path: examples/retool/retool_qwen3_4b_rl.sh
    profile: slime_retool
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
    overlay_args:
      - "--hf-checkpoint ${SLIME_MODEL_PATH}"
      - "--ref-load ${SLIME_TORCH_DIST_PATH}"
      - "--prompt-data ${SLIME_FIXTURE_JSONL}"
      - "--input-key prompt"
      - "--label-key label"
      - --apply-chat-template
      - "--reward-key score"
      - "--custom-generate-function-path generate_with_retool.generate"
      - "--custom-rm-path generate_with_retool.reward_func"
      - "--num-rollout 2"
      - "--rollout-batch-size 4"
      - "--n-samples-per-prompt 2"
      - "--global-batch-size 8"
      - "--rollout-max-response-len 512"
      - "--rollout-max-context-len 1024"
      - "--rollout-temperature 0.8"
      - "--attention-dropout 0.0"
      - "--hidden-dropout 0.0"
      - "--actor-num-gpus-per-node 4"
      - "--rollout-num-gpus 4"
      - "--num-gpus-per-node 8"
      - "--tensor-model-parallel-size 4"
      - "--rollout-num-gpus-per-engine 2"
      - "--sglang-device npu"
      - "--sglang-mem-fraction-static 0.4"
      - "--sglang-cuda-graph-max-bs 4"
      - "--max-tokens-per-gpu 1024"
      - "--log-probs-chunk-size 128"
      - --use-dynamic-batch-size
      - "--recompute-granularity full"
      - "--recompute-method uniform"
      - "--recompute-num-layers 1"
      - "--attention-backend flash"
      - --ci-test

  # ReTool SFT：监督对话训练；保留原生 SFT token mask，四卡 TP4 和重计算控制显存。
  - path: examples/retool/retool_qwen3_4b_sft.sh
    profile: slime_retool_sft
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
