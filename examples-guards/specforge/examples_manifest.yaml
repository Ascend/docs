version: 1
scan:
  # specforge 的 "examples" 形态特殊：训练入口是 specforge CLI（不是各 example
  # 自带 python 脚本），recipe 是 typed YAML，shell wrapper 只是把 CONFIG=
  # 翻译成 `specforge train --config <path>`。files-only 模型：
  # 入口源文件 = yaml config / sh script / py utility；include_extensions
  # 只收 .sh / .py / .yaml，.ipynb / .md / 图像 / 字体天然不进。
  # YAML recipes 是被消费的入口，不是 helper，所以默认 include 进来。
  root: examples
  include_extensions: ['.sh', '.py', '.yaml']

supported:
  # ===== 2026-09-24 overlay 消融（coder sglang-hdc 2×910B4，ed64d27 + sglang
  # 0.5.18 + CANN 9.0）：qwen3.5-4b-dflash-online-npu 删 max_length/save_interval/
  # batch_size/accumulation_steps 后 1 步跑通（11min，step1+consumer_done 落盘）；
  # qwen3-4b-dspark-disaggregated 再删 report_to/nproc_per_node 共 7 项同样跑通
  # （6min）。分级结论：
  #   必须——target_model_path（HF 不可达）/ train_data_path（recipe 默认路径在
  #     CI workdir 不存在）/ receive_buffers=pageable（schema 默认 pinned，NPU
  #     崩，run 35225016001）/ attention_backend=sdpa（recipe 缺省或显式
  #     flex_attention，flex 在 NPU 直接 ValueError "only supported on CUDA,
  #     CPU or HPU"）/ report_to=none（recipe 为 tensorboard|wandb，镜像和
  #     setup 都不装两者）/ nproc_per_node=1（recipe 8|14|7 卡，runner 只有
  #     4 卡）/ embedding_key（qwen3.5 hybrid 嵌套路径）/ batch_size 或
  #     accumulation_steps 压 1（仅当 recipe 默认推高 optimizer 窗口使 1 行
  #     fixture 凑不满一个窗口：qwen3.5 族 2×4=8、qwen3-8b-dspark accum=512、
  #     offline-8b-dflash batch=4；FeatureDataLoader drop_last=True）。
  #   已删（纯冗余）——save_interval=0（1 步永不触发周期保存，训练结束 final
  #     state 照常落盘）/ data.max_length=512（fixture ~130 token，3072 默认
  #     产出相同 batch）/ 与 recipe|schema 默认重合的 batch_size=1、
  #     accumulation_steps=1、report_to=none、nproc_per_node=1。
  #   保留（有效果的非必须项）——num_anchors=32（producer 提速，锚点数按
  #     min(num_anchors, max_valid) 自动钳制，非必须）/ log_interval=1（1 步
  #     训练唯一的 loss 输出行，默认 50 时无指标日志）。
  # 注意：offline 条目删 max_length 未单独实测（prepare_hidden_states.py 也
  # 消费该值，语义为截断上限，fixture 远短于 512/3072，推定等价），下次 CI
  # 跑 offline 腿时自然验证。=====
  - path: examples/configs/online/disaggregated/external/qwen3.5-4b-dflash-online-npu.yaml
    profile: specforge
    runner: linux-aarch64-a2-4                # 4 卡 runner：capture 卡 0、trainer 卡 1，卡 2/3 留给 HCCL buffer
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      # 训练规模压到 1 步：recipe 默认 num_epochs=10 / max_steps=10000 / batch_size=2 / accumulation_steps=4
      # → 单 epoch 几十小时；CI 1 步即可验证 producer→mooncake→consumer 链路。
      # batch/accum 压 1：默认 2×4=8 refs/优化步窗口，全靠 num_epochs=10 × 1 行
      # fixture = 10 refs 恰好凑满一个窗口（2026-09-24 消融实测可删但脆弱）。
      - training.max_steps=1
      - training.batch_size=1
      - training.accumulation_steps=1
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      # 锚点数压到 32：recipe 默认 num_anchors=512 是按 3.5-4B 训练稳定度调的；
      # 1 步训练不会触发 dflash 的 loss_decay 累积，32 个 anchor 已经够
      # producer 走完一整条采样链；锚点越少单步耗时越短（实测从 ~120s 降到 ~30s）。
      # 非必须（dflash_family_model.py:448 按 min(num_anchors, max_valid) 自动
      # 钳制，512 在短样本下也能跑通），留作 producer 提速。
      - training.num_anchors=32
      # 1 步训练唯一的 loss 输出行（recipe 默认 log_interval=50 时 1 步无指标日志）。
      - training.log_interval=1
      # 关掉 tensorboard 上报：recipe 默认 report_to=tensorboard，而镜像/setup 都
      # 不装 tensorboard（SummaryWriter=None，tracker 构建直接报错）；CI 不需要 TB。
      - tracking.report_to=none
      # trainer 进程数压到 1：recipe 默认 nproc_per_node=8 是按 8 卡 A2 pod 调的，
      # smoke 只用卡 1 跑 trainer，单进程足够；卡 0 给 sglang capture server。
      - deployment.trainer.nproc_per_node=1
      # receive_buffers 显式回退 pageable：上游把默认值改成 pinned 后，NPU 上
      # pin 判定走 torch.cuda.is_available() 恒为 False，pageable host buffer
      # register_buffer 返回 -600 变成硬 RuntimeError；pageable 走 get_into 老路径
      # 正常。与 Quick-start-Ascend.md smoke-train-launch 保持一致。
      - deployment.disaggregated.receive_buffers=pageable
      # target model 路径：recipe 默认 Qwen/Qwen3.5-4B（HF Hub，runner 不可达），
      # 覆成 setup_example.sh 从 ModelScope 预下载并 export 的本地路径。
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
      # Qwen3.5-4B 是 hybrid Mamba/GDN，文本 decoder 嵌在 model.language_model.*；
      # smoke train 的 FSDP 初始化要从这个嵌套路径拿 embed，否则会拿 None。
      - model.embedding_key=model.language_model.embed_tokens.weight
      # run_id 是 dflash consumer 拿 SQLite WAL + mooncake store_id 的命名空间；
      # recipe 默认 qwen3.5-4b-dflash-npu-online，CI 输出目录要清旧日志避免
      # _claim_fresh_control_path 拒绝继续跑。直接复用 recipe 默认值即可，
      # 不在这里显式覆。
    timeout_minutes: 180                       # 冷缓存下 Qwen3.5-4B snapshot + sglang 首次 graph compile (5-10 min) + 1 步训练

  # ===== dflash 家族 + dspark（在 coder NPU 端到端验证通过：纯 torch sketch
  # 模型 + sdpa attention，无 triton/xformers 依赖）。capture 的 method /
  # aux layer ids 由 run_example.sh 经 resolve_server_capture_contract 动态
  # 解析，不再硬编码 dflash。dflash2 / dspark 已实测 1 步训练出 step loss；
  # qwen3-4b-dflash / qwen2.5-0.5b-dflash 为 dflash 同构，dpace 为 dflash 的
  # loss_type 变体，--plan 全部通过。8B 条目为单卡 32G HBM 边界（16G 权重
  # + Adam 状态），batch_size=1 + expandable_segments 下可装。=====
  - path: examples/configs/online/disaggregated/external/qwen3.5-4b-dflash2-online-npu.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1
      - training.accumulation_steps=1
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.log_interval=1
      - tracking.report_to=none
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
      # recipe 把 embedding_key 写成了 model.embed_tokens.weight；Qwen3.5-4B 是
      # hybrid Mamba/GDN，文本 decoder 嵌在 model.language_model.* 下。
      - model.embedding_key=model.language_model.embed_tokens.weight
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/external/qwen3-4b-dspark-disaggregated.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    # 2026-09-24 消融实测本条最小集（+log_interval）：recipe 已是 batch_size=1 /
    # nproc_per_node=1，accumulation_steps / report_to 走 schema 默认 1 / none。
    overlay_args:
      - training.max_steps=1
      - training.attention_backend=sdpa
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.log_interval=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/external/qwen3-4b-dflash-online.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1  # recipe 默认 4：1 行 fixture + drop_last=True 凑不出 batch，必须压 1
      - training.attention_backend=sdpa
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.log_interval=1
      - tracking.report_to=none
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/external/qwen3-8b-dflash-online.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1  # recipe 默认 4：1 行 fixture + drop_last=True 凑不出 batch，必须压 1
      - training.attention_backend=sdpa
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.log_interval=1
      - tracking.report_to=none
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/external/qwen3-8b-dpace-online.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1  # recipe 默认 4：1 行 fixture + drop_last=True 凑不出 batch，必须压 1
      - training.attention_backend=sdpa
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.log_interval=1
      - tracking.report_to=none
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/external/qwen3-8b-dspark-disaggregated.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.accumulation_steps=1  # recipe 默认 512：10 refs 凑不满一个 512 窗口 → 0 步，必须压 1
      - training.attention_backend=sdpa
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.log_interval=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  # ===== managed-local dflash：单个 `specforge train` 拥有全栈（mooncake +
  # capture server + producer + consumer 由 launch_plan supervisor 起），
  # run_example.sh 对 managed-local/ 路径不起外部服务，但 supervisor 的
  # capture server 是本进程子进程、继承 env——run_example.sh 需先 export
  # atb lib（Qwen3.5 族 lazy-load libatb.so，否则 server 在首个
  # _npu_reshape_and_cache 处 OSError 退出，status -9）。recipe 锁死的
  # trainer 卡数通过结构化 overlay 压缩（apply_overrides 对 [...] 走
  # yaml.safe_load）：nproc_per_node=1 + trainer_cuda_visible_devices=["1"]，
  # capture server 留卡 0。8B 的 capture 需 mem_fraction_static=0.65（0.5
  # 会 OOM）。
  # 注意 overlay 传递链（run 35811075823 两腿失败的根因，2026-09-23 修复）：
  # run_example.sh 的 expand_overlay 曾用 shlex.split 剥掉 item 内的双引号、
  # eval "EXTRA_ARGS=( ... )" 的双引号包裹层又会吞掉 token 内的双引号——
  # ["1"] 变 [1]（int，List[str] 拒绝）、{"port":30000,...} 变 YAML flow
  # {port:30000,...}（无空格冒号全解析成单个 key）。现改为每 item 原样
  # 一个 argv 元素 + 无包裹 eval，结构化 overlay 经真实 load_config 验证；
  # 4B managed-local 全链路（overlay→load_config→supervisor 全栈）在 coder
  # 2x910B4 以 CI 同款调用端到端跑通（step 1 + 干净退出），此前该 entry
  # 在 CI 从未绿过（先撞配置解析，再会撞 libatb）。=====
  - path: examples/configs/online/disaggregated/managed-local/qwen3.5-4b-dflash-disaggregated-npu.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1
      - training.accumulation_steps=1
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.log_interval=1
      - tracking.report_to=none
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.managed_local.trainer_cuda_visible_devices=["1"]
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/managed-local/qwen3-8b-dflash-1server-dp7-disaggregated.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1  # recipe 默认 2：压 1 让 1 行 fixture 稳定凑满窗口
      - training.attention_backend=sdpa
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.log_interval=1
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.managed_local.trainer_cuda_visible_devices=["1"]
      - deployment.disaggregated.managed_local.capture_servers=[{"port":30000,"cuda_visible_devices":["0"],"tp_size":1,"mem_fraction_static":0.65}]
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  # ===== offline/colocated（2026-09-23 coder 2x910B4 端到端实测通过）：
  # 纯 torch trainer（sdpa）读盘训练，前置 prepare_hidden_states.py（in-proc
  # sglang capture，--sglang-attention-backend ascend，不需要 mooncake、不
  # 需要 spec-capture server patch），run_example.sh 的 offline 分支自动跑
  # 预生成步骤。qwen3-4b-dspark-offline（step 1 loss=3.715）与 qwen3-8b-
  # dflash-offline（step 1 loss=13.96）直接实测通过；qwen3-8b-dspark-offline
  # 为两个已验证半程的组合（8B dflash in-proc capture + 8B dspark trainer，
  # 后者由 supported 的 online qwen3-8b-dspark-disaggregated 证明）。
  # mem-fraction：4B 0.5 即可、8B 需 >=0.537，统一用 SPECFORGE_PREPARE_
  # MEM_FRACTION 默认 0.65。=====
  - path: examples/configs/offline/colocated/qwen3-4b-dspark-offline.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    # recipe 已是 batch_size=1 / nproc_per_node=1，accumulation_steps / report_to
    # 走 schema 默认 1 / none（同 qwen3-4b-dspark-disaggregated 消融结论）。
    overlay_args:
      - training.max_steps=1
      - training.attention_backend=sdpa
      - training.log_interval=1
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/offline/colocated/qwen3-8b-dflash-offline.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1  # recipe 默认 4：prepare 只产 1 个样本，drop_last=True 下凑不出 batch，必须压 1
      - training.attention_backend=sdpa
      - training.num_anchors=32
      - training.log_interval=1
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

  - path: examples/configs/offline/colocated/qwen3-8b-dspark-offline.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    # recipe 已是 batch_size=1 / nproc_per_node=1，accumulation_steps / report_to
    # 走 schema 默认 1 / none（同 qwen3-4b-dspark-disaggregated 消融结论）。
    overlay_args:
      - training.max_steps=1
      - training.attention_backend=sdpa
      - training.log_interval=1
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
    timeout_minutes: 180

unsupported:
  # ===== LFM2.5 DFLASH：sglang 0.5.18 无 LFM2 capture setter（2026-09-23 源码确认）。
  # LiquidAI/LFM2.5-1.2B-Instruct 在 ModelScope 存在（Code 200），arch=
  # Lfm2ForCausalLM（/sgl-workspace/sglang/python/sglang/srt/models/lfm2.py），
  # 但该文件既没实现 set_dflash_layers_to_capture 也没实现 set_dspark_layers_
  # to_capture（grep 全 models/ 的 setter 名单里没有 lfm2）。model_runner.py:923
  # configure_aux_hidden_state_capture 对 dflash/dspark 走 hasattr 检查，两个
  # setter 都缺 → ValueError "implements neither ..." → scheduler abort，
  # specforge train 端走不到。与 qwen2.5-0.5b-dflash 同类（等 sglang 上游给
  # Lfm2ForCausalLM 补 setter）。模型本身 1.2B/2.4GB BF16/vocab 65536，单卡
  # 装载无压力；specforge 自带的 spec-capture patch 只改 scheduler/传输层，
  # 不加模型 setter，帮不上。=====
  - examples/configs/online/disaggregated/external/lfm2.5-1.2b-instruct-dflash-online.yaml

  # ===== Ling-flash-2.0 EAGLE3：双重阻断（2026-09-23 源码 + ModelScope 确认）。
  # (1) inclusionAI/Ling-flash-2.0 是 BailingMoeV2ForCausalLM（model_type
  # bailing_moe，vocab 157184，32 层，~31B MoE → BF16 ~62GB）：4 卡 runner 上
  # TP2=31GB/卡 超 0.85x32G=27.2GB 预算，TP4+trainer=5 卡超物理上限。
  # (2) EAGLE3 LogSoftmaxLoss：vocab 157184 > MAX_FUSED_SIZE 131072，loss.py
  # _calculate_settings 直接 RuntimeError（连 triton 编译阶段都到不了）。
  # capture 侧反而 OK：bailing_moe.py:1019 BailingMoEForCausalLM 有
  # set_eagle3_layers_to_capture（V2 继承）。等 EAGLE3 loss 上游化 + 8 卡
  # runner 才有解。=====
  - examples/configs/online/disaggregated/external/ling-flash-2.0-eagle3-online.yaml

  # ===== Qwen3.6/3.8-27B managed-local 家族：32G HBM 物理装不下（2026-09-23
  # ModelScope config 确认：arch=Qwen3_5ForConditionalGeneration、model_type
  # qwen3_5、64 层、hidden 5120、vocab 248320、dense 27B → BF16 54GB）。
  # - 1server-dp2 recipe 默认 capture TP1 单卡：54GB >> 32G，直接 OOM；
  # - TP2=27GB/卡 vs mem_fraction 0.85 预算 27.8GB：权重吃满，KV cache/
  #   graph 内存为 0，运行期必 OOM；
