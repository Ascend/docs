  # ===== EAGLE3 算法：specforge train 1 步在 910B4 NPU 端到端跑不通 =====
  # 全部 6 条 EAGLE3 external online recipe（qwen2.5-0.5b / qwen3-4b /
  # gemma3-1b / phi4 / deepseek-v2-lite / longcat-flash）已在 2026-09-22
  # coder sglang-hdc（2x 910B4，sglang 0.5.18-cann9.1.0 镜像 + CANN 9.1.0）
  # 跑通 sglang capture server 健康启动（每条 recipe 的 target model 类
  # Qwen2ForCausalLM/Qwen3ForCausalLM/Gemma3ForCausalLM/Phi3ForCausalLM
  # 继承自 LlamaForCausalLM/DeepseekV2ForCausalLM/LongcatFlashForCausalLM
  # 都实现了 set_eagle3_layers_to_capture），但 specforge train consumer
  # 必撞 triton-ascend BiShengHIR compile 错误：
  #   1) specforge/core/loss.py:50 LogSoftmaxLoss.forward 在 vocab=151936
  #      的 log_softmax forward kernel 编译时
  #      MLIRCompilationError: ub overflow, requires 2621696 bits while
  #      1572864 bits available（910B4 UB 上限 ~192KB，tile 过大）
  #   2) specforge/algorithms/eagle3/model.py:599 _compute_target_p（被
  #      @torch.compile(dynamic=None) 装饰）在 argmax over target vocab
  #      时 triton emit `_tmp3_next, _tmp3_index_next = triton_helpers
  #      .maximum_with_index(_tmp3, _tmp3_index, tmp2, rindex)`，
  #      triton-ascend 不知道 rindex 变量 → NameError('rindex is not defined')。
  # 实测 qwen2.5-0.5b-eagle3（无 TORCHDYNAMO_DISABLE=1 时）就触发第 2 条
  # （@torch.compile 装饰器路径），设 TORCHDYNAMO_DISABLE=1 关掉 dynamo
  # 走 eager 路径则落第 1 条（loss.py:50 triton 自定义 autograd kernel
  # 仍然走 triton-ascend 编译）。两条都不可在 NPU 上解决。
  # 2026-09-23 补充实测（阻断性结论加固）：
  #   - vocab 二分：LogSoftmaxLoss 在 910B4 上 vocab<=8192 可正常编译运行
  #     （loss 数值正确）；vocab>=16384 必撞 ub overflow（16384→需 320KB、
  #     32768→640KB、102400→2.5MB，线性增长，UB 只有 192KB）——真实模型
  #     vocab 全部 >=64K，无一幸免；
  #   - vocab>131072（qwen3 151936 / ling 157184 等）在 _calculate_settings
  #     的 MAX_FUSED_SIZE 检查处直接 Python RuntimeError，到不了编译阶段；
  #   - triton-ascend 升级验证：3.2.1.dev20260530（镜像自带）与 3.2.2
  #     （ascend pypi 最新）在 vocab 16384/32768/102400 上同样 ub overflow
  #     ——这是 kernel 按整行 vocab 单 block 设计与 910B4 192KB UB 的硬冲突，
  #     换 triton-ascend 版本无解；
  #   - 第 2 条（torch.compile rindex）有纯 overlay 绕法：training.
  #     trim_loss_positions=true + batch_size=1 + 无 lk_loss 时 eagle3/
  #     model.py:720 走 _compute_target_p_eager 分块路径（不进 dynamo），
  #     但绕不过第 1 条，无意义。
  # qwen3-4b-eagle3 在更早的 target_head.load_weights 阶段还多撞一条：
  # Qwen3-4B config.json tie_word_embeddings=true，specforge 默认
  # lm_head_key="lm_head.weight" 在 model.safetensors.index.json 找不到
  # 这个 weight（共享给 embed_tokens.weight），target_head 端必须设
  # lm_head_key="model.embed_tokens.weight" 才能加载；recipe 没覆这个。
  # 总结：6 条 EAGLE3 全部 (capture OK + train 必崩)，留在 unsupported
  # 等 specforge 上游：
  #   (a) LogSoftmaxLoss kernel 改 row-wise 小 tile / 分块，或像 domino_loss
  #       一样提供 use_fused=False 的纯 torch reference 路径（domino 已有，
  #       eagle3 没有——这是唯一硬阻断）
  #   (b) _compute_target_p 默认走 _compute_target_p_eager 分块路径
  #   (c) target_head.load_weights 处理 tie_word_embeddings=true
  # (b)(c) 可 overlay 规避，(a) 是上游 kernel 改动，recipe 端 overlay 改不了；
  # 用户约束"不能打任何patch"也禁止本地 patch。
  - examples/configs/online/disaggregated/external/qwen2.5-0.5b-eagle3-online.yaml
  - examples/configs/online/disaggregated/external/qwen3-4b-eagle3-online.yaml
