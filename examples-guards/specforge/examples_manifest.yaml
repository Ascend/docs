  # ===== Domino Qwen3-8B：sglang capture 端 OK，但 specforge train DominoDraftModel
  # prefix_gru nn.GRU 权重 dtype 与 embed_tokens input dtype 撞 torch 强类型 =====
  # 2026-09-23 在 coder sglang-hdc（ed64d27 主线 + CANN 9.0.0 + torch_npu 2.10）
  # 重新实测 qwen3-8b-domino-disaggregated（external recipe，卡0 capture + 卡1
  # trainer），三种 overlay 组合全部失败，根因链已完全定位：
  #   (1) 默认 bf16 + FSDP：domino.py:64 _run_gru 的 NPU 守门触发（input bf16
  #       → functional_call 换 fp16 参数副本跑），但 FSDP 包装下守门的
  #       functional_call 仍然报 "input must have the type torch.bfloat16,
  #       got type torch.float16"（rnn.py:307 check_input 读 _flat_weights[0]，
  #       FSDP 的参数管理与 stateless swap 不兼容）；
  #   (2) model.torch_dtype=float16 + FSDP：backend.py:44 ParallelConfig 把
  #       FSDP MixedPrecision param_dtype 硬编码为 bfloat16（无 config 旋钮），
  #       forward 时把 GRU 重铸回 bf16 而 embed（frozen，不进 FSDP）保持
  #       fp16 → 同样报错（走 domino.py:80 非守门路径）。此前"torch_dtype=
  #       float16 不能修复"的记录即此，与 draft config json 的 dtype 字段无关；
  #   (3) training.fsdp_sharding=NO_SHARD（schema 合法值，cli.py 会用它覆写
  #       FSDP_SHARDING env → backend.py 走 DDP 分支、无 mixed precision 重铸）
  #       + bf16：守门生效，forward 全程跑通（_VF.gru → torch_npu.npu_gru），
  #       但 backward 撞 CANN DynamicGRUV2Grad inner error（trans_TransData_26
  #       DoTiling failed）。独立复现：nn.GRU fp16 (32,16,4096) bias=False 的
  #       backward 在 910B4/CANN 9.0.0 上按 shape 间歇性失败（blocks=4/32 均
  #       复现过，8/64 通过），且随机初始化权重下 fp16 GRU 输入梯度经常
  #       非有限——是 torch_npu/CANN 内核级缺陷 + fp16 数值安全问题。
  # 结论：domino 在 NPU 需要两处上游修复才有解：(a) specforge 把 FSDP
  # param_dtype 做成可配置（或 NPU 下不做 bf16 重铸）；(b) CANN/torch_npu
  # 修 DynamicGRUV2Grad 的 tiling 崩溃，或 specforge 把 GRU 改成 fp32 计算。
  # 覆盖 qwen3-8b 全部 4 个 domino entry：external -disaggregated（实测）、
  # external -online（同构）、managed-local 1server-dp7（同构）、
  # managed-local multiserver（2xTP1 capture + dp2 trainer = 4 卡，卡数本身
  # 在 4 卡 runner 内放得下，纯被 GRU 链阻断）。
  - examples/configs/online/disaggregated/external/qwen3-8b-domino-disaggregated.yaml
  - examples/configs/online/disaggregated/external/qwen3-8b-domino-online.yaml
  - examples/configs/online/disaggregated/managed-local/qwen3-8b-domino-1server-dp7-disaggregated.yaml
  - examples/configs/online/disaggregated/managed-local/qwen3-8b-domino-multiserver-disaggregated.yaml


