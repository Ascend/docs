version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py', '.yaml']
supported:
  # vllm serve a public DFlash speculator, then GuideLLM HumanEval
  # acceptance-rate. Overlay shrinks 80 requests to a CI smoke.
  # Honest red on vllm-ascend 0.23: the DFlash drafter dummy_run hits
  # the RoPE positions.shape[0] == num_tokens assertion. Keep supported.
  - path: examples/evaluate/example_qwen3_8b_dflash_humaneval.sh
    profile: evaluate
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --max-requests 4
    timeout_minutes: 180
  # Online DSpark on Qwen3-0.6B. Script already uses 1 card for vLLM and
  # 1 card for torchrun; 2x910B4 is enough after CI-scale samples/steps.
  - path: examples/train/dspark_qwen3_0_6b_sharegpt_online.sh
    profile: train
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --draft-attn-impl sdpa
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
  # Online DFlash / DFlash2 / Eagle3 / P-EAGLE on Qwen3-8B. Upstream
  # keeps vLLM (DP=2) and the trainer on disjoint cards, so 4 devices.
  # --draft-attn-impl sdpa is the documented Ascend path; flex attention
  # is not available on this stack.
  - path: examples/train/dflash_qwen3_8b_ultrachat_online_5k.sh
    profile: train
    runner: linux-aarch64-a2-8
    npu_devices: '0,1,2,3'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --draft-attn-impl sdpa
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
  # Honest red: CI-scale sequence length OOMs the training card on
  # 910B4 32GB. Keep supported.
  - path: examples/train/dflash2_qwen3_8b_ultrachat_online_5k.sh
    profile: train
    runner: linux-aarch64-a2-8
    npu_devices: '0,1,2,3'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --draft-attn-impl sdpa
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
  - path: examples/train/dflash_qwen3_8b_ultrachat_online_5k_bestpractices.sh
    profile: train
    runner: linux-aarch64-a2-8
    npu_devices: '0,1,2,3'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --draft-attn-impl sdpa
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
  - path: examples/train/eagle3_qwen3_8b_ultrachat_online_5k.sh
    profile: train
    runner: linux-aarch64-a2-8
    npu_devices: '0,1,2,3'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --draft-attn-impl sdpa
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
  # Upstream hardcodes VLLM_GPUS=2,3 TRAIN_GPUS=4,5. Working-copy
  # patch remaps those vars onto 0,1 / 2,3 so the job fits a 4-device
  # slice of linux-aarch64-a2-8.
  # Honest red: CI-scale sequence length OOMs the training card on
  # 910B4 32GB. Keep supported.
  - path: examples/train/peagle_qwen3_8b_ultrachat_online_5k.sh
    profile: train
    runner: linux-aarch64-a2-8
    npu_devices: '0,1,2,3'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --draft-attn-impl sdpa
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
  # Online MTP finetune of Qwen3.5-9B native heads. MTP does not take
  # --draft-attn-impl. 1 card vLLM + 1 card train.
  - path: examples/train/mtp_qwen3_5_9b_gsm8k_online.sh
    profile: train
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
    overlay_args:
      - --max-steps 2
      - --epochs 1
    timeout_minutes: 180
unsupported:
  # Draft yuhuili/EAGLE3-LLaMA3.1-Instruct-8B is not on ModelScope.
  # The Llama-3.1 verifier is mirrored, but this is a one-line convert
  # script: the current patcher requires a health wait and a train or
  # evaluate command. Quick Start covers DFlash convert instead.
  - examples/convert/eagle3/apply_eagle3_eagle.sh
  # Llama-4 Maverick 17B-128E MoE plus a w4a16 verifier. No matching
  # 910B4 HBM; --validate-device is written as cuda:0. NVIDIA Eagle3
  # draft is not on ModelScope.
  - examples/convert/eagle3/apply_eagle3_llama4_maverick.sh
  # Offline Eagle3 on Llama-3.1-8B. ModelScope has an ungated remirror
  # (AI-ModelScope/Llama-3.1-8B-Instruct). Not lifted yet: needs a
  # MODEL remap and its own coder run; Qwen Eagle3 online already
  # covers the algorithm on this stack.
  - examples/train/eagle3_llama3_8b_ultrachat_offline_5k.sh
  # Kimi-K3 DSpark: 2-node TP8 extractor + 1-node trainer + Mooncake,
  # hardcoded for an NVIDIA NVL72 rack (NVLink, flashinfer, TRTLLM
  # attention). Weights are ~1.56 TB. No matching Ascend hardware.
  - examples/train/kimi_k3_dspark/launch_extractor_node.sh
  - examples/train/kimi_k3_dspark/launch_train_node.sh
