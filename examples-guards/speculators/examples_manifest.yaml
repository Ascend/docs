version: 1
scan:
  root: examples
  include_extensions: ['.sh', '.py', '.yaml']
# Nothing is supported. Each upstream script either fails on this stack
# as shipped, or only reaches a CI-scale run after a working-copy edit
# (forwarding "$@", shrinking samples, swapping flex attention for sdpa,
# remapping hardcoded GPU ids). Those edits are not made. Re-promote an
# entry only when the upstream script can run unchanged.
supported: []
unsupported:
  # vllm-ascend 0.23 DFlash drafter dummy_run hits the RoPE assertion
  # positions.shape[0] == num_tokens. The script also hardcodes
  # --max-requests 80 and does not forward extra arguments.
  - examples/evaluate/example_qwen3_8b_dflash_humaneval.sh
  # Assigns MAX_SAMPLES=5000 and does not forward "$@", so CI cannot
  # pass --draft-attn-impl sdpa or shrink the step count without
  # editing the script. Upstream training defaults to flex attention,
  # which this NPU stack does not provide.
  - examples/train/dspark_qwen3_0_6b_sharegpt_online.sh
  - examples/train/dflash_qwen3_8b_ultrachat_online_5k.sh
  - examples/train/dflash_qwen3_8b_ultrachat_online_5k_bestpractices.sh
  - examples/train/eagle3_qwen3_8b_ultrachat_online_5k.sh
  # Same missing argument forwarding. At CI scale on 910B4 32GB the
  # training card also OOMs.
  - examples/train/dflash2_qwen3_8b_ultrachat_online_5k.sh
  # Hardcodes VLLM_GPUS=2,3 and TRAIN_GPUS=4,5, so a 4-card slice does
  # not match the script. Also OOMs at CI scale on 910B4 32GB, and does
  # not forward extra arguments.
  - examples/train/peagle_qwen3_8b_ultrachat_online_5k.sh
  # MTP does not take --draft-attn-impl, but the script still assigns
  # MAX_SAMPLES=5000 and does not forward extra arguments, so the step
  # count cannot be shrunk without editing it.
  - examples/train/mtp_qwen3_5_9b_gsm8k_online.sh
  # One-line convert. The draft yuhuili/EAGLE3-LLaMA3.1-Instruct-8B is
  # not on ModelScope. Quick Start covers DFlash convert instead.
  - examples/convert/eagle3/apply_eagle3_eagle.sh
  # Llama-4 Maverick 17B-128E MoE plus a w4a16 verifier. No matching
  # 910B4 HBM. --validate-device is written as cuda:0. The NVIDIA Eagle3
  # draft is not on ModelScope.
  - examples/convert/eagle3/apply_eagle3_llama4_maverick.sh
  # Offline Eagle3 on Llama-3.1-8B. ModelScope has an ungated remirror
  # (AI-ModelScope/Llama-3.1-8B-Instruct). Still needs a model-id remap
  # verified on the Hong Kong runners; not part of this migration.
  - examples/train/eagle3_llama3_8b_ultrachat_offline_5k.sh
  # Kimi-K3 DSpark: 2-node TP8 extractor + 1-node trainer + Mooncake,
  # hardcoded for an NVIDIA NVL72 rack (NVLink, flashinfer, TRTLLM
  # attention). Weights are ~1.56 TB. No matching Ascend hardware.
  - examples/train/kimi_k3_dspark/launch_extractor_node.sh
  - examples/train/kimi_k3_dspark/launch_train_node.sh
