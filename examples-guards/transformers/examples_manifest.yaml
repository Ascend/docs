version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  # overlay_args 约定：
  #   - 只写与脚本默认值不同的项；每个参数的注释解释其作用或取值原因。
  #   - ${VAR} 引用 setup_example.sh 写入 GITHUB_ENV 的模型快照路径变量
  #     （DISTILBERT_PATH/TINYGPT2_PATH/TINYMBART_PATH/TINYXLNET_PATH/
  #     TINYVIT_PATH/TINYMAE_PATH/TINYCLIP_PATH/TINYWAV2VEC2_PATH/
  #     TINYWHISPER_PATH）；${TARGET_ROOT} 为上游仓库 checkout 根目录，
  #     ${CI_OUTPUT_DIR} 为本 job 的产物目录（两者均由引擎注入）。
  # --- 以下用例均已在 NPU 验证通过，全量放开执行 ---
  - path: examples/pytorch/text-generation/run_generation.py
    profile: generation
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # 脚本按该架构名选择 AutoModel/AutoTokenizer 的实例化类（非 HF 模型 id）
      - --model_type gpt2
      # 模型来源：setup_example.sh 导出的 tiny-gpt2 本地快照路径（离线加载）
      - --model_name_or_path ${TINYGPT2_PATH}
      # 生成起始提示词
      - --prompt Hello
      # 本轮生成的最大 token 数；smoke 只验证生成链路，取最小开销
      - --length 10
      # 固定采样随机种子，保证结果可复现
      - --seed 42
    timeout_minutes: 60
  - path: examples/pytorch/text-classification/run_glue_no_trainer.py
    profile: glue
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # 模型来源：setup_example.sh 导出的 distilbert 本地快照路径（离线加载）
      - --model_name_or_path ${DISTILBERT_PATH}
      # 上游自带 MRPC 训练/验证 csv fixture，替代 Hub 数据集下载
      - --train_file ${TARGET_ROOT}/tests/fixtures/tests_samples/MRPC/train.csv
      - --validation_file ${TARGET_ROOT}/tests/fixtures/tests_samples/MRPC/dev.csv
      # tokenizer 最大序列长度（截断/填充基准）；MRPC 句子短，64 足够
      - --max_length 64
      # 每卡训练/验证 batch size
      - --per_device_train_batch_size 2
      - --per_device_eval_batch_size 2
      # 只跑 1 个优化步，smoke 预算（no-trainer 版参数名带下划线）
      - --max_train_steps 1
      # 训练产物落盘目录，收进 job artifacts
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  - path: examples/pytorch/question-answering/run_qa_no_trainer.py
    profile: small-training
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # 模型来源：setup_example.sh 导出的 distilbert 本地快照路径（离线加载）
      - --model_name_or_path ${DISTILBERT_PATH}
      # 上游自带 SQUAD 样本 json fixture；同文件复用作训练/验证
      - --train_file ${TARGET_ROOT}/tests/fixtures/tests_samples/SQUAD/sample.json
      - --validation_file ${TARGET_ROOT}/tests/fixtures/tests_samples/SQUAD/sample.json
      # 声明数据含 no-answer 样本（SQuAD 2.0 语义），影响预处理与评估指标路径
      - --version_2_with_negative
      # 问答输入最大 token 长度
      - --max_seq_length 128
      # 长文档滑窗切分步长（相邻窗口重叠 128-64=64 token）
      - --doc_stride 64
      # 各取 4 条样本，smoke 预算
      - --max_train_samples 4
      - --max_eval_samples 4
      # 每卡训练/验证 batch size
      - --per_device_train_batch_size 1
      - --per_device_eval_batch_size 1
      # 只跑 1 个优化步，smoke 预算
      - --max_train_steps 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
