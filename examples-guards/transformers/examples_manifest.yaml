version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  # overlay_args 约定：
  #   - 只写与脚本默认值不同的项；每个参数的注释解释其作用或取值原因。
  #   - ${TINYLLAMA_PATH} 由 setup_example.sh 预下后写入 GITHUB_ENV；
  #     ${CI_OUTPUT_DIR} 为本 job 的产物目录，由引擎注入。
  #
  # 范围说明：上游 v5.20.0 起删除 examples/pytorch/ 整棵树（PR #49357），
  # 原先 27 条 generation/GLUE/QA/摘要/翻译/视觉/语音用例失去对应源文件。
  # v5 现存可独立运行的入口只剩下面这一条。
  - path: examples/scheduler/run_greedy.py
    profile: lm
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      # 默认 meta-llama/Llama-3.2-1B 是 gated 模型，Runner 拉不到；改用
      # setup_example.sh 导出的 tiny 因果 LM 本地快照。脚本默认
      # from_config 从零训练，只需 config + tokenizer，不读权重。
      - --model_name_or_path ${TINYLLAMA_PATH}
      # 默认 2000 步，压成 1 步 smoke（eval_steps=200 / save_steps=500
      # 因此不会触发，训练结束直接 save_model）
      - --max_steps 1
      - --per_device_train_batch_size 1
      - --gradient_accumulation_steps 1
      - --block_size 128
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
unsupported:
  # --- 上游 v5.20.0 起删除 examples/pytorch/ 整棵树（PR #49357）---
  # 原 supported 的 27 条（generation / GLUE / QA / SWAG / NER / CLM / MLM /
  # 摘要 / 翻译 / 图像分类 / MAE / MIM / CTC / CLIP / 音频分类）以及原
  # unsupported 中的 pytorch/**（3D_parallel / context_parallel /
  # distributed_training / conftest / test_* / xla_spawn / run_fim /
  # run_plm / run_xnli / object-detection 等）均已随上游删除，文件不存在，
  # 不再逐条列出。依据：https://github.com/huggingface/transformers/pull/49357
  # 删除后 examples/ 只剩 generate / modular-transformers / quantization /
  # scheduler 四个目录。
  # --- generate/*：服务型常驻或超出 smoke 预算 ---
  # continuous_batching.py：model.cuda() 与 ProfilerActivity.CUDA 硬编码，
  #   文件自注“mostly used for benchmarking”。
  # continuous_batching_simple.py：MODEL_ID（Qwen/Qwen3-4B-Instruct-2507）
  #   与 openai/gsm8k 双硬编码且无 CLI 开关；默认 attention 走
  #   kernels-community/flash-attn2（NPU 无该 kernel）。
  # transformers_serve_cb_eval_job.py：服务型 eval job，不会自行退出。
  - examples/generate/continuous_batching.py
  - examples/generate/continuous_batching_simple.py
  - examples/generate/transformers_serve_cb_eval_job.py
  # --- quantization/*：耦合 Hub 模型下载与 HfApi 上传，非 NPU 训练入口 ---
  - examples/quantization/custom_quantization.py
  - examples/quantization/custom_quantization_int8_example.py
  # --- modular-transformers/*：modular 转换器的输入源文件，无 __main__，不是可运行入口 ---
  - examples/modular-transformers/configuration_dummy.py
  - examples/modular-transformers/configuration_duplicated_method.py
  - examples/modular-transformers/configuration_my_new_model.py
  - examples/modular-transformers/configuration_my_new_model2.py
  - examples/modular-transformers/configuration_new_model.py
  - examples/modular-transformers/configuration_super.py
  - examples/modular-transformers/image_processing_new_imgproc_model.py
  - examples/modular-transformers/modeling_add_function.py
  - examples/modular-transformers/modeling_dummy_bert.py
  - examples/modular-transformers/modeling_from_uppercase_model.py
  - examples/modular-transformers/modeling_global_indexing.py
  - examples/modular-transformers/modeling_multimodal2.py
  - examples/modular-transformers/modeling_my_new_model2.py
  - examples/modular-transformers/modeling_new_task_model.py
  - examples/modular-transformers/modeling_roberta.py
  - examples/modular-transformers/modeling_super.py
  - examples/modular-transformers/modeling_switch_function.py
  - examples/modular-transformers/modeling_test_detr.py
  - examples/modular-transformers/modeling_test_suffix.py
