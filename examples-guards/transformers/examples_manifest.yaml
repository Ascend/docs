  # ---脚本对 CUDA/NCCL 的硬编码 ---
  # 3D_parallel.py / 3d_parallel_checks.py：
  #   dist.init_process_group("nccl") + DeviceMesh(device_type="cuda") +
  #   torch.cuda.set_device 全部硬编码 CUDA/NCCL（NPU 需 hccl + npu 设备）；
  # context_parallel.py：
  #   init_device_mesh("cuda") / device="cuda" / device_map 全部硬编码，
  #   NPU 环境无 CUDA 后端；
  #   SDPBackend.FLASH_ATTENTION 为 CUDA 专属 backend。
  # distributed_training.py：
  #   模块顶层无条件读取 OMPI_COMM_WORLD_* 环境变量（torchrun 启动直接
  #   KeyError），只能用 mpirun（OpenMPI）启动，Runner 未提供；backend
  #   限定 nccl/gloo，nccl 分支再用 cuda:{LOCAL_RANK} 设备，NPU 不适用。
  - examples/3D_parallel.py
  - examples/pytorch/3d_parallel_checks.py
  - examples/pytorch/context_parallel.py
  - examples/training/distributed_training.py
  # --- modular-transformers/*：modular 转换器的输入源文件，无 __main__，不是可运行入口 ---
  - examples/modular-transformers/configuration_dummy.py
